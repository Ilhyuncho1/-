// ------------------------------------------------------------------
// window.storage 대체 구현 (claude.ai 아티팩트 전용 API를 브라우저의
// localStorage로 흉내낸 것입니다. 실제 저장은 이 브라우저 안에만 됩니다.)
// ------------------------------------------------------------------
(function () {
  const PREFIX = "pureAppraisal:";
  window.storage = {
    async get(key) {
      const raw = window.localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error("Key not found: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      window.localStorage.setItem(PREFIX + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      window.localStorage.removeItem(PREFIX + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf(PREFIX) === 0) {
          const short = k.slice(PREFIX.length);
          if (!prefix || short.indexOf(prefix) === 0) keys.push(short);
        }
      }
      return { keys, prefix, shared: false };
    },
  };
})();
</script>

function buildHistoryNote(history) {
  if (!history || history.length === 0) return "";

    .slice(-MAX_HISTORY)

function buildHouseholdDescription(env) {

  if (env.customNote && env.customNote.trim()) {

  return parts.join(" · ");

function buildProfileNote(ageRange, gender) {

}

function extractJson(text) {
  let start = -1;
  for (let i = 0; i < text.length; i++) {
    if (text[i] === "{" || text[i] === "[") { start = i; break; }
  }
  if (start === -1) throw new Error("JSON 시작을 찾을 수 없습니다");
  const openChar = text[start];
  const closeChar = openChar === "{" ? "}" : "]";
  let depth = 0, inString = false, escape = false;
  for (let i = start; i < text.length; i++) {
    const ch = text[i];
    if (inString) {
      if (escape) escape = false;
      else if (ch === "\\") escape = true;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') { inString = true; continue; }
    if (ch === openChar) depth++;
    else if (ch === closeChar) { depth--; if (depth === 0) return text.slice(start, i + 1); }
  }
  throw new Error("JSON 괄호가 맞지 않습니다");
}

async function callClaude(prompt, useSearch, maxTokens) {
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: maxTokens || 1500,
    messages: [{ role: "user", content: prompt }],
  };
  if (useSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  const res = await fetch("https://pure-appraisal-proxy.ihcho705.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) throw new Error(`API 오류: ${data.error.message || JSON.stringify(data.error)}`);
  const textBlocks = (data.content || []).filter((b) => b.type === "text").map((b) => b.text);
  if (textBlocks.length === 0) throw new Error("응답에 텍스트가 없습니다");

  const candidates = [...textBlocks].reverse().concat([textBlocks.join("\n")]);
  let lastError = null;
  for (const candidate of candidates) {
    try {
      const jsonStr = extractJson(candidate);
      return JSON.parse(jsonStr);
    } catch (e) {
      lastError = e;
    }
  }
  throw new Error(`JSON 파싱 실패: ${lastError?.message || "알 수 없는 오류"}`);
}

async function callClaudeAutoRetry(prompt, useSearch, maxTokens, attempt = 1) {
  try {
    return await callClaude(prompt, useSearch, maxTokens);
  } catch (e) {
    if (attempt >= 3) throw e;
    const isTruncated = String(e.message || "").includes("max_tokens");
    const nextTokens = isTruncated ? Math.min(maxTokens * 2, 8192) : maxTokens;
    await new Promise((r) => setTimeout(r, 900 * attempt));
    return callClaudeAutoRetry(prompt, useSearch, nextTokens, attempt + 1);
  }
}

[1] 범위 판정
이 서비스는 오직 다음 조건을 모두 만족하는 "실물 소비재 제품" 카테고리만 다룰 수 있습니다:
- 특정 브랜드/모델명이 존재하고 여러 제조사 제품 중 하나를 골라야 하는 것
- 온라인/오프라인 판매처에서 정가를 주고 구매하는 물건 (배송받거나 매장에서 수령하는 유형의 물건)
- 여러 판매처 가격 비교, AS/반품 정책 비교가 실제로 의미 있는 것
범위 밖(false) 예시: 해외여행, 국내여행지, 여행자보험, 각종 보험 상품, 금융상품(예금/적금/펀드/대출), 이사/시공/인테리어 같은 시공 서비스, 학원/과외/강의, 구독형 디지털 서비스(OTT, 소프트웨어 구독), 병원/의료 시술, 웨딩/이벤트 서비스, 부동산(전월세/매매), 취업/이직 관련.
범위 안(true) 예시: 정수기(렌탈이어도 실물 기기를 고르는 것이므로 true), 무선청소기, 매트리스, 스마트폰, 노트북, 가구, 유모차, 안마의자, 자동차(신차/중고차 모델 선택), 화장품.
애매하면(예: "명절 선물세트"처럼 실물이지만 브랜드 비교 의미가 약한 경우) false 쪽으로 판단하세요.

[2] 체험 필요 여부
"직접 몸으로 체험(착용감, 사이즈, 그립감, 타격감, 승차감 등)해봐야 제대로 판단되는 제품"인지 판단하세요.
체험 필요(true) 예시: 매트리스, 신발, 골프클럽, 안마의자, 자동차, 이어폰(착용감 중요 모델), 의자, 등산화, 자전거(사이즈).
체험 불필요(false) 예시: 무선청소기, 식기세척기, 냉장고, 전자레인지, 정수기, 스마트폰.

[3] 성별 관련성
구매자의 성별에 따라 제품 스펙/선택 자체가 달라지는 카테고리인지 판단하세요.
화장품, 향수, 면도용품, 언더웨어, 의류, 신발처럼 실제 제품 라인업이 갈리는 경우만 true. 가전제품, 가구, 전자기기처럼 성별과 무관한 경우는 false.

[4] 대분류 분류
아래 목록 중 정확히 하나로 분류하세요. 애매하면 가장 가까운 것, 전혀 해당 없으면 "기타".

입력된 카테고리: "${category}"

다른 설명 없이 JSON만 응답:
{
  "in_scope": true 또는 false,

  "gender_relevant": true 또는 false,
  "category_group": "위 대분류 목록 중 하나의 문자열"

  return callClaudeAutoRetry(prompt, false, 500);
}

async function generateDiagnosis(category, env, ageRange, gender, history, candidateProduct) {

  const candidateNote = candidateProduct
    ? `\n이 사람은 이미 "${candidateProduct}"라는 특정 제품을 염두에 두고 있으며, 그 선택에 확신을 얻거나 재검토하려는 목적입니다. 질문은 처음부터 새로 고르는 사람이 아니라 이미 후보가 있는 사람에게 맞게 만드세요.`
    : "";
  const prompt = `"${category}" 구매자(${profileNote}, 환경: ${env.size}, ${householdDesc})를 아래 6가지 유형 중 하나로 즉시 구분할 수 있는 질문을 정확히 1개 만드세요.

다른 설명 없이 JSON으로만 응답:
{"question": "질문", "options": [{"label": "선택지", "type": "위 6가지 유형 중 하나"}]}
options는 정확히 4개, 각각 다른 유형에 매핑되어야 합니다.${historyNote}`;

반드시 지켜야 할 규칙:

2. 정확히 1개의 질문은 실제 지불 가능한 예산대를 직접 묻는 질문이어야 하며 "budget_check": true로 표시하세요. 이 질문의 options는 "${category}"의 실제 시장 가격 분포를 반영한 4개 구간(저가~프리미엄)이어야 하며, 성향("${buyerType}")과 무관하게 사용자가 실제로 원하는 가격대를 스스로 선택하게 하세요. 절대 "${buyerType}"이 가성비형이라는 이유로 저가 구간을 유도하는 문구를 쓰지 마세요.

다른 설명 없이 JSON 배열로만 응답, 정확히 6개 항목:
[{"question": "...", "options": ["...","...","...","..."], "regret_check": false, "budget_check": false, "candidate_check": false}]`;

2. 정확히 1개의 질문은 실제 지불 가능한 예산대를 직접 묻는 질문이어야 하며 "budget_check": true로 표시하세요. options는 "${category}"의 실제 시장 가격 분포를 반영한 4개 구간이어야 합니다. 과거 예산 경향("${patternInfo.typical_budget_hint_kr || "정보 없음"}")은 참고만 하고, 사용자가 이번 기준으로 스스로 다시 고르게 하세요.${candidateRule}

다른 설명 없이 JSON 배열로만 응답, 정확히 ${candidateProduct ? 3 : 2}개 항목:
[{"question": "...", "options": ["...","...","...","..."], "regret_check": false, "budget_check": false, "candidate_check": false}]`;
  return callClaudeAutoRetry(prompt, false, 900);
}

async function generateRecommendation(category, buyerType, env, qa, ageRange, gender, extraNote, history, candidateProduct, fastTrackInfo, nickname) {
  const householdDesc = buildHouseholdDescription(env);
  const profileNote = buildProfileNote(ageRange, gender);
  const historyNote = buildHistoryNote(history);
  const budgetEntry = qa.find((x) => x.budget_check);
  const candidateEntry = qa.find((x) => x.candidate_check);
  const qaText = qa.map((x, i) => `${i + 1}. ${x.question} → ${x.answer}`).join("\n");
  const extraText = extraNote && extraNote.trim() ? `\n\n[사용자가 직접 추가로 남긴 메모]\n${extraNote.trim()}\n이 메모에 담긴 제약조건(신체조건, 특수 상황 등)이 있다면 반드시 추천에 반영하세요.` : "";
  const budgetInstruction = budgetEntry
    ? `사용자가 명시적으로 선택한 예산대는 "${budgetEntry.answer}"입니다. 이 예산대는 절대적 하드 제약조건입니다 — 소비 성향이 "${buyerType}"이더라도 이 예산대를 벗어난(특히 임의로 더 저렴한) 제품을 추천하지 마세요. 두 추천 제품의 실제 가격이 이 구간 안(또는 바로 인접한 범위)에 들어와야 합니다.`
    : `사용자가 예산대를 명시하지 않았으므로 성향과 환경에 맞는 합리적인 가격대를 추정하되, 무조건 최저가로 치우치지 마세요.`;

  const candidateInstruction = candidateProduct
    ? `
이 사용자는 이미 "${candidateProduct}"를 구매 후보로 염두에 두고 있습니다 (구체적 우려사항: "${candidateEntry ? candidateEntry.answer : "명시 없음"}").
이건 발견 모드가 아니라 비교/검증 모드입니다. 반드시 아래 규칙을 지키세요:
1. recommendations의 첫 번째 항목은 "${candidateProduct}" 자체에 대한 정직한 평가여야 합니다 (name은 정확히 "${candidateProduct}"). 웹 검색으로 실제 후기를 찾아 진짜 장단점을 밝히세요. 사용자를 기분 좋게 하려고 장점을 과장하거나 단점을 숨기지 마세요.
2. recommendations의 두 번째 항목은 그 대안이 될 만한 다른 제품 1개입니다. 만약 "${candidateProduct}"가 이미 최선의 선택이라고 판단되면, 두 번째 항목은 "그래도 비교해볼 만한 대안"으로서 정직하게 왜 후보만 못한지 설명하세요. 반대로 대안이 실제로 더 낫다면 그 이유를 분명히 밝히세요.
3. 최상위 필드로 "verdict_kr"를 추가하세요: "${candidateProduct}"와 대안을 직접 비교해서 이 사용자에게 어느 쪽이 더 맞는지 솔직하게 결론 내리는 3~4문장. 무조건 후보를 지지하거나 무조건 대안을 추천하지 말고, 근거에 기반해 판단하세요. 사용자 기분을 맞추기 위한 눈치보기 없이 사실대로 말하세요.`
    : `
최상위 필드로 "verdict_kr"는 null로 응답하세요 (비교 후보가 없으므로 사용 안 함).`;

  const fastTrackInstruction = fastTrackInfo
    ? `\n이 사용자는 과거 유사 이력 ${fastTrackInfo.matched_count || 2}건을 바탕으로 "빠른 진단 모드"로 진행되었습니다. 최상위 필드로 "opening_line_kr"을 추가하세요: "${nickname ? `${nickname}님, ` : ""}[이 사람이 이 유형 제품에서 일관되게 중요시해온 것: ${fastTrackInfo.pattern_summary_kr || ""}]을(를) 중요시하는 당신께 추천하는 제품은" 으로 시작하는 자연스러운 1문장.`
    : `\n최상위 필드로 "opening_line_kr"은 null로 응답하세요 (빠른 진단 모드가 아니므로 사용 안 함).`;

const newVsUsedInstruction = `\n신품/중고 구분이 존재하는 카테고리(자동차, 가전 일부 등)라면: 사용자의 답변이나 메모에서 "중고", "중고차", "리퍼", "리퍼비시" 등을 명시적으로 언급하지 않는 한, 무조건 신품(새 제품/신차) 기준으로만 추천하세요. 중고 거래 플랫폼이나 중고 매물은 절대 recommendations에 포함하지 마세요.`;

  const prompt = `당신은 광고·협찬·제휴 수수료를 절대 받지 않는 독립 제품 감정 전문가입니다. 
"${category}" 구매 고민자(성향: ${buyerType}, ${profileNote}, 주거환경: ${env.size}, 가구형태: ${householdDesc})의 분석 정보입니다:
${qaText}
${extraText}

${budgetInstruction}${historyNote}
${candidateInstruction}
${fastTrackInstruction}
${newVsUsedInstruction}

웹 검색으로 실제 사용자 후기를 찾되 협찬/광고 글은 철저히 제외하세요. 
구매자의 부담을 줄여주는 정보(총 소유 비용 TCO 및 배우자/가족 설득 요약)를 포함하여 JSON으로 응답하세요:

{
  "reviews_analyzed": 정수,
  "ad_filtered_note": "필터링 방식 15자 이내",
  "sources": ["출처 최대 4개"],
  "verdict_kr": "비교 모드일 때만 위 규칙에 따라 작성, 아니면 null",
  "opening_line_kr": "빠른 진단 모드일 때만 위 규칙에 따라 작성, 아니면 null",
  "recommendations": [
    {
      "name": "정확한 실존 제품명", "brand": "브랜드명", "match_score": 0~100 정수,
      "is_user_choice": true 또는 false,
      "why_kr": "이 사람에게 맞는 이유 1문장",
      "cons_kr": ["단점 2개, 각 15자 이내"],
      "pros_kr": ["장점 2개, 각 15자 이내"],
      "price_range_kr": "예상 가격대",
      "tco_note_kr": "연간 예상 유지비 및 필터/전기세 등 소모품 비용 요약 15자 이내",
      "persuasion_3lines": ["가족/배우자 설득 포인트 1", "설득 포인트 2", "설득 포인트 3"],
      "safety_net_kr": "실패 예방 대비책 1문장"
    }
  ]
}
recommendations는 정확히 2개. 마크다운 없이 순수 JSON만 출력하세요.`;
  return callClaudeAutoRetry(prompt, true, 4096);
}

async function generateVendorComparison(productName) {
  const prompt = `"${productName}"을 판매하는 온라인 판매처 4곳을 웹 검색으로 찾으세요. (공식몰, 오픈마켓 등).
URL에는 절대 제휴 파라미터(affid, ref 등)를 포함하지 말고 순수 원본 URL(Clean URL)만 수집하세요.

신품/중고 규칙 (매우 중요):
0. "${productName}"이 신품(새 제품/신차)이라면, 절대로 중고 거래 플랫폼(중고차 사이트, 중고나라, 당근마켓, 번개장터, 헬로마켓 등)을 판매처로 넣지 마세요. 반드시 제조사 공식몰, 공식 대리점, 또는 신품을 취급하는 온라인 쇼핑몰(오픈마켓의 신품 카테고리 등)만 포함하세요.

URL 선정 규칙 (매우 중요):
1. 절대로 URL을 추측하거나 지어내지 마세요. 실제 웹 검색 결과에서 실제로 확인한 URL만 사용하세요.
2. "${productName}" 상품 상세 페이지(구매 버튼이 바로 보이는 페이지) URL을 검색 결과에서 100% 확실하게 확인한 경우에만 "url_type": "detail"로 표시하고 그 URL을 넣으세요.
3. 조금이라도 확신이 서지 않으면(페이지가 존재하는지 불확실, 검색 결과에 스니펫만 있고 실제 URL 구조를 못 봄, 오래된 정보일 수 있음 등) 절대로 상세 페이지 URL을 만들어내지 말고, 대신 그 판매처 사이트 안에서 "${productName}"을 검색한 결과 페이지 URL(사이트명 + 검색 파라미터 형태, 예: "https://www.판매처.com/search?query=상품명")로 대체하고 "url_type": "search_results"로 표시하세요.
4. 판단이 애매할 때는 무조건 3번(검색결과 페이지)을 선택하세요. 안전한 쪽으로 판단하는 것이 원칙입니다. 존재하지 않는 페이지로 연결되는 것보다, 검색결과 페이지로 연결되는 것이 훨씬 낫습니다.
5. 절대로 판매처의 단순 홈페이지(메인 화면) URL만 넣지 마세요.

재고 확인 규칙 (매우 중요):
6. 검색 결과나 페이지 내용에 "품절", "재고없음", "일시품절", "Sold Out", "단종" 같은 표현이 보이면 그 판매처는 최대한 제외하고 재고가 있어 보이는 다른 판매처로 대체하세요. 4곳 모두 이런 문제가 없는 곳으로 채우는 것이 최우선입니다.
7. 그래도 재고 상태를 확신할 수 없는 판매처가 포함될 수밖에 없다면, "stock_status" 필드에 "in_stock"(재고 확인됨), "uncertain"(확신 불가), "likely_out"(품절 가능성 높음) 중 하나로 정직하게 표시하세요. 절대 무조건 "in_stock"으로 채우지 마세요.
8. 이건 검색 시점 기준 정보이며 실시간 재고와 다를 수 있다는 점을 감안해 최대한 최근 정보를 우선하세요.

다른 설명 없이 JSON만 응답:
{
  "sort_basis": "정렬 기준 (예: 상품가+배송비 합산 최저가순)",
  "vendors": [
    {"name": "판매처명", "price_krw": "가격(배송비 포함여부)", "shipping_kr": "배송정책 요약", "as_kr": "AS/반품 정책 요약", "url": "제휴코드 없는 원본 URL", "url_type": "detail 또는 search_results", "stock_status": "in_stock 또는 uncertain 또는 likely_out"}
  ]
}
vendors는 정확히 4개입니다.`;
  return callClaudeAutoRetry(prompt, true, 2200);
}

function AdaptiveAppraisalTest() {
  const [stage, setStage] = useState("category");
  const [category, setCategory] = useState("");
  const [env, setEnv] = useState({ size: "30평대", householdSize: "3~4인 가구", composition: ["영유아"], customNote: "" });
  const [ageRange, setAgeRange] = useState("40대");
  const [gender, setGender] = useState(null);
  const [genderApplicable, setGenderApplicable] = useState(false);
  const [diagnosis, setDiagnosis] = useState(null);
  const [buyerType, setBuyerType] = useState("");
  const [path, setPath] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [answersByIndex, setAnswersByIndex] = useState({});
  const [result, setResult] = useState(null);
  const [reportId, setReportId] = useState("");
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [copied, setCopied] = useState(false);
  const [openVendor, setOpenVendor] = useState({});
  const [vendorData, setVendorData] = useState({});
  const [vendorLoading, setVendorLoading] = useState({});
  const [vendorError, setVendorError] = useState({});
  const [nickname, setNickname] = useState("");
  const [profileLoaded, setProfileLoaded] = useState(false);
  const [profileFound, setProfileFound] = useState(false);
  const [history, setHistory] = useState([]);
  const [extraNote, setExtraNote] = useState("");
  const [pendingAnswers, setPendingAnswers] = useState(null);
  const [hasCandidate, setHasCandidate] = useState(null);
  const [candidateProduct, setCandidateProduct] = useState("");
  const [candidateInput, setCandidateInput] = useState("");
  const [showCandidateInput, setShowCandidateInput] = useState(false);
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [scopeInfo, setScopeInfo] = useState(null);
  const [handsOnInfo, setHandsOnInfo] = useState(null);
  const [fastTrackActive, setFastTrackActive] = useState(false);
  const [fastTrackInfo, setFastTrackInfo] = useState(null);
  const [pendingGroup, setPendingGroup] = useState(null);

  useEffect(() => {
    setSelectedIdx(null);
  }, [stage, qIndex]);

  const selectAndProceed = (idx, actionFn) => {
    if (selectedIdx !== null) return; // 중복 클릭 방지
    setSelectedIdx(idx);
    setTimeout(() => actionFn(), 300);
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(PROFILE_KEY, false);
        if (res && res.value) {
          const p = JSON.parse(res.value);
          if (p.nickname) setNickname(p.nickname);
          if (p.ageRange) setAgeRange(p.ageRange);
          if (p.gender) setGender(p.gender);
          if (Array.isArray(p.history)) setHistory(p.history);
          if (p.env && typeof p.env === "object") {
            setEnv({
              size: p.env.size || "30평대",
              householdSize: p.env.householdSize || "3~4인 가구",
              composition: Array.isArray(p.env.composition) ? p.env.composition : [],
              customNote: p.env.customNote || "",
            });
          }
          setProfileFound(true);
        }
      } catch (e) {
        // 저장된 프로필이 없으면 정상적으로 무시
      }
      setProfileLoaded(true);
    })();
  }, []);

  const saveProfile = async (updates) => {
    try {
      const merged = { nickname, ageRange, gender, history, env, ...updates };
      await window.storage.set(PROFILE_KEY, JSON.stringify(merged), false);
      setProfileFound(true);
    } catch (e) {
      // 저장 실패해도 서비스 이용에는 지장 없음
    }
  };

  const clearProfile = async () => {
    try {
      await window.storage.delete(PROFILE_KEY, false);
    } catch (e) {}
    setNickname(""); setHistory([]); setProfileFound(false);
    setEnv({ size: "30평대", householdSize: "3~4인 가구", composition: [], customNote: "" });
  };

  const toggleComposition = (tag) => {
    setEnv((prev) => {
      const has = prev.composition.includes(tag);
      const composition = has ? prev.composition.filter((t) => t !== tag) : [...prev.composition, tag];
      return { ...prev, composition };
    });
  };

  const reset = () => {
    setStage("category"); setCategory(""); setDiagnosis(null); setBuyerType("");
    setPath([]); setQIndex(0); setAnswersByIndex({});
    setResult(null); setError(null); setBusy(false); setCopied(false);
    setGender(null); setGenderApplicable(false);
    setExtraNote(""); setPendingAnswers(null);
    setHasCandidate(null); setCandidateProduct(""); setCandidateInput(""); setShowCandidateInput(false);
    setScopeInfo(null);
    setHandsOnInfo(null);
    setFastTrackActive(false); setFastTrackInfo(null);
    setPendingGroup(null);
    setOpenVendor({}); setVendorData({}); setVendorLoading({}); setVendorError({});
  };

  const proceedToDiagnosis = async () => {
    const group = pendingGroup || "기타";

    try {
      const matched = history.filter((h) => h.categoryGroup === group);
      if (matched.length >= 2) {
        const typeCounts = {};
        matched.forEach((h) => { typeCounts[h.buyerType] = (typeCounts[h.buyerType] || 0) + 1; });
        const inferredType = Object.keys(typeCounts).sort((a, b) => typeCounts[b] - typeCounts[a])[0];

        const budgetCounts = {};
        matched.forEach((h) => { if (h.budgetAnswer) budgetCounts[h.budgetAnswer] = (budgetCounts[h.budgetAnswer] || 0) + 1; });
        const budgetKeys = Object.keys(budgetCounts);
        const typicalBudget = budgetKeys.length ? budgetKeys.sort((a, b) => budgetCounts[b] - budgetCounts[a])[0] : null;

        const ft = {
          fast_track: true,
          matched_count: matched.length,
          inferred_buyer_type: inferredType,
          typical_budget_hint_kr: typicalBudget,
          pattern_summary_kr: `${inferredType}${typicalBudget ? `, 보통 ${typicalBudget}` : ""}`,
        };

        setFastTrackActive(true);
        setFastTrackInfo(ft);
        setBuyerType(inferredType);
        const p = await generateFastPath(category.trim(), inferredType, env, ageRange, gender, candidateProduct, ft);
        setPath(p);
        setQIndex(0);
        setAnswersByIndex({});
        setStage("answering");
        setBusy(false);
        return;
      }

      setFastTrackActive(false);
      setFastTrackInfo(null);
      const d = await generateDiagnosis(category.trim(), env, ageRange, gender, history, candidateProduct);
      setDiagnosis(d);
      setStage("diagnosis");
    } catch (e) { setError(`유형 진단 질문 생성 중 오류: ${e.message}`); }
    setBusy(false);
  };

  const switchToFullDiagnosis = async () => {
    setBusy(true); setError(null);
    setFastTrackActive(false); setFastTrackInfo(null);
    try {
      const d = await generateDiagnosis(category.trim(), env, ageRange, gender, history, candidateProduct);
      setDiagnosis(d);
      setStage("diagnosis");
    } catch (e) { setError(`유형 진단 질문 생성 중 오류: ${e.message}`); }
    setBusy(false);
  };

  const startCategory = async () => {
    if (!category.trim()) return;
    setError(null);
    setBusy(true);
    try {
      const meta = await checkCategoryMeta(category.trim());
      if (meta && meta.in_scope === false) {
        setScopeInfo(meta);
        setStage("outOfScope");
        setBusy(false);
        return;
      }
      if (meta) {
        setHandsOnInfo(meta.hands_on_recommended ? meta : null);
        setGenderApplicable(!!meta.gender_relevant);
        setPendingGroup(meta.category_group || "기타");
      }
    } catch (e) {
      // 범위 판별 자체가 실패하면 서비스 흐름을 막지 않고 통과시킴
      setHandsOnInfo(null);
      setGenderApplicable(false);
      setPendingGroup("기타");
    }
    saveProfile({ nickname, ageRange });
    setBusy(false);
    setStage("candidate");
  };

  const backToCategoryEdit = () => {
    setScopeInfo(null);
    setStage("category");
  };

  const afterCandidateDecision = () => {
    setError(null);
    if (genderApplicable) {
      setStage("gender");
      return;
    }
    setBusy(true);
    proceedToDiagnosis();
  };

  const chooseNoCandidate = () => {
    setHasCandidate(false); setCandidateProduct(""); setGender(null);
    afterCandidateDecision();
  };

  const confirmCandidate = () => {
    if (!candidateInput.trim()) return;
    setHasCandidate(true); setCandidateProduct(candidateInput.trim()); setGender(null);
    afterCandidateDecision();
  };

  const answerGender = async (g) => {
    setGender(g);
    setBusy(true); setError(null);
    await proceedToDiagnosis();
  };

  const answerDiagnosis = async (opt) => {
    setBusy(true); setError(null);
    setBuyerType(opt.type);
    try {
      const p = await generatePath(category.trim(), opt.type, env, ageRange, gender, candidateProduct);
      setPath(p);
      setQIndex(0);
      setAnswersByIndex({});
      setStage("answering");
    } catch (e) { setError("질문 경로 생성 중 오류가 발생했습니다."); }
    setBusy(false);
  };

  const finishToAnalysis = async (finalAnswers, note) => {
    setStage("analyzing"); setError(null);
    setOpenVendor({}); setVendorData({}); setVendorLoading({}); setVendorError({});
    const qaList = path
      .map((q, i) => (i in finalAnswers ? { question: q.question, answer: finalAnswers[i], budget_check: !!q.budget_check, candidate_check: !!q.candidate_check } : null))
      .filter(Boolean);
    try {
      const r = await generateRecommendation(category.trim(), buyerType, env, qaList, ageRange, gender, note, history, candidateProduct, fastTrackActive ? fastTrackInfo : null, nickname);
      setResult(r);
      setReportId(genId());
      setStage("teaser"); // 티저(결제/언락 유도) 단계로 이동
      const budgetEntry = qaList.find((x) => x.budget_check);
      const newHistory = [...history, { category: category.trim(), categoryGroup: pendingGroup || "기타", buyerType, budgetAnswer: budgetEntry ? budgetEntry.answer : "", date: new Date().toISOString().slice(0, 10) }].slice(-MAX_HISTORY);
      setHistory(newHistory);
      saveProfile({ history: newHistory });
    } catch (e) {
      setError(`감정서 생성 중 오류: ${e.message}`);
      setStage("analyzeError");
    }
  };

  const answerCurrent = (opt) => {
    const newAnswers = { ...answersByIndex, [qIndex]: opt };
    setAnswersByIndex(newAnswers);
    if (qIndex + 1 < path.length) {
      setQIndex(qIndex + 1);
    } else {
      setPendingAnswers(newAnswers);
      setExtraNote("");
      setStage("extra");
    }
  };

  const submitExtraAndAnalyze = () => {
    finishToAnalysis(pendingAnswers, extraNote);
  };

  const unlockReport = () => {
    setStage("result");
  };

  const fetchVendorData = async (recIndex, productName) => {
    setVendorLoading((prev) => ({ ...prev, [recIndex]: true }));
    setVendorError((prev) => ({ ...prev, [recIndex]: null }));
    try {
      const v = await generateVendorComparison(productName);
      setVendorData((prev) => ({ ...prev, [recIndex]: v }));
    } catch (e) {
      setVendorError((prev) => ({ ...prev, [recIndex]: `구매처 조회 실패: ${e.message}` }));
    }
    setVendorLoading((prev) => ({ ...prev, [recIndex]: false }));
  };

  const toggleVendorCompare = (recIndex, productName) => {
    setOpenVendor((prev) => ({ ...prev, [recIndex]: !prev[recIndex] }));
    if (vendorData[recIndex] || vendorLoading[recIndex]) return;
    fetchVendorData(recIndex, productName);
  };

  const retryVendorCompare = (recIndex, productName) => {
    fetchVendorData(recIndex, productName);
  };

  const copyShareLink = () => {
    navigator.clipboard.writeText(`[내편랩 독립 감정서] ${category} 추천 결과 (${reportId})`);
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: C.bg, color: C.text, fontFamily: "'Source Sans 3', sans-serif" }}>
      <style>{`
        .serif { font-family: 'Source Serif 4', serif; }
        .jbmono { font-family: 'JetBrains Mono', monospace; }
      `}</style>

      {/* 헤더 */}
      <div className="px-6 pt-6 pb-4 flex items-center justify-between max-w-2xl mx-auto border-b" style={{ borderColor: C.border }}>
        <div className="flex items-center gap-2">
          <ShieldCheck size={22} style={{ color: C.gold }} />
          <span className="serif text-lg font-semibold">내편랩 · MySide Lab</span>
        </div>
        {stage !== "category" && (
          <button onClick={reset} className="flex items-center gap-1 text-xs jbmono" style={{ color: C.textDim }}>
            <RotateCcw size={12} /> 새로 진단
          </button>
        )}
      </div>

      <div className="max-w-2xl mx-auto px-6 pb-16">
        {error && (
          <div className="mt-4 px-3 py-2 rounded text-sm flex items-center gap-2" style={{ backgroundColor: `${C.warn}18`, color: C.warn, border: `1px solid ${C.warn}44` }}>
            <AlertCircle size={16} /> {error}
          </div>
        )}

        {/* STEP 0: 카테고리 & 환경 설정 */}
        {stage === "category" && (
          <div className="mt-8">
            <div className="text-xs jbmono tracking-widest mb-2" style={{ color: C.gold }}>INDEPENDENT PAID APPRAISAL</div>
            <h1 className="serif text-2xl font-semibold leading-snug mb-2">구매 고민 중인 제품을 입력하세요</h1>
            <p className="text-sm mb-4" style={{ color: C.textMuted }}>
              광고·제휴 수수료 0%. 유저 정액 감정료로만 운영되며 원본 링크(Clean URL)만 제공합니다.
            </p>

            {profileLoaded && profileFound && (
              <div className="flex items-center justify-between text-xs px-3 py-2 rounded mb-5" style={{ backgroundColor: `${C.verify}10`, border: `1px solid ${C.verify}30`, color: C.textMuted }}>
                <span><Check size={12} className="inline mr-1" style={{ color: C.verify }} />{nickname ? `${nickname}님, ` : ""}저장된 프로필(주거 환경 포함)을 불러왔어요 (감정 이력 {history.length}건)</span>
                <button onClick={clearProfile} className="jbmono underline shrink-0 ml-2" style={{ color: C.textDim }}>삭제</button>
              </div>

            <label className="text-xs jbmono block mb-1 text-dim" style={{ color: C.textMuted }}>1. 카테고리 입력</label>
            <input

              style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
            />
            <p className="text-xs mb-6" style={{ color: C.textDim }}>
              <Lock size={11} className="inline mr-1" />닉네임·연령대·성별·감정 이력은 본인 Claude 계정에만 저장되며 외부로 전송되지 않아요.

            <label className="text-xs jbmono block mb-2 text-dim" style={{ color: C.textMuted }}>2. 구매자 연령대</label>
            <div className="grid grid-cols-3 gap-2 mb-6">
              {AGE_RANGES.map((a) => (
                <button

                  {a}

              ))}

              <div>

                  <option>10평대 (원룸/1.5룸)</option>
                  <option>20평대 (투룸/소형아파트)</option>
                  <option>30평대 (표준 아파트)</option>

              </div>
              <div>
                <span className="text-xs block mb-1" style={{ color: C.textDim }}>가구원 수</span>

                  value={env.householdSize} onChange={(e) => setEnv({ ...env, householdSize: e.target.value })}

                  <option>5인 이상 대가족</option>

            </div>

            <span className="text-xs block mb-2" style={{ color: C.textDim }}>동거 구성원 (해당 항목 모두 선택)</span>

                    type="button"
                    onClick={() => toggleComposition(tag)}
                    className="text-xs px-3 py-1.5 rounded-full transition-all"
                    style={{
                      backgroundColor: active ? C.gold : C.paper,
                      color: active ? "#171310" : C.textMuted,
                      border: `1px solid ${active ? C.gold : C.borderLight}`,

                  >
                    {active ? "✓ " : ""}{tag}

                );

            </div>

            <input
              value={env.customNote} onChange={(e) => setEnv({ ...env, customNote: e.target.value })}
              placeholder="기타 (예: 반려묘 2마리, 거동 불편한 부모님 등 자유 입력)"
              className="w-full px-3 py-2.5 rounded text-xs outline-none mb-6"
              style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
            />

            <button
              onClick={startCategory} disabled={busy || !category.trim()}
              className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: busy || !category.trim() ? C.paperRaised : C.gold, color: busy || !category.trim() ? C.textDim : "#171310" }}
            >
              {busy ? "카테고리 확인 중..." : "맞춤 심리 진단 시작"} {!busy && <ArrowRight size={16} />}
            </button>
          </div>
        )}

        {/* 범위 밖 카테고리 안내 */}
        {stage === "outOfScope" && scopeInfo && (
          <div className="mt-8">
            <div className="p-5 rounded-lg mb-6" style={{ backgroundColor: `${C.warn}10`, border: `1px solid ${C.warn}44` }}>
              <div className="flex items-center gap-2 mb-3">
                <AlertCircle size={18} style={{ color: C.warn }} />
                <span className="jbmono text-xs" style={{ color: C.warn }}>지원 범위 밖 · {scopeInfo.category_type_kr}</span>
              </div>
              <h2 className="serif text-xl font-semibold mb-2 leading-snug">"{category}"는 아직 감정해드릴 수 없어요</h2>
              <p className="text-sm leading-relaxed" style={{ color: C.textMuted }}>
                {scopeInfo.reason_kr}. 이 서비스는 브랜드/모델을 비교해 판매처에서 구매하는 <span style={{ color: C.text }}>실물 제품</span>에 한해 정확한 감정을 제공해요. 여행, 보험, 시공, 구독 서비스처럼 정찰 가격 비교가 어려운 영역은 아직 준비 중입니다.
              </p>
            </div>

            {scopeInfo.example_categories_kr && scopeInfo.example_categories_kr.length > 0 && (
              <div className="mb-6">
                <span className="text-xs block mb-2" style={{ color: C.textDim }}>대신 이런 실물 제품은 감정 가능해요</span>
                <div className="flex flex-wrap gap-2">
                  {scopeInfo.example_categories_kr.map((ex, i) => (
                    <button
                      key={i}
                      onClick={() => { setCategory(ex); setScopeInfo(null); setStage("category"); }}
                      className="text-xs px-3 py-1.5 rounded-full transition-all"
                      style={{ backgroundColor: C.paper, color: C.text, border: `1px solid ${C.borderLight}` }}
                    >
                      {ex}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <button
              onClick={backToCategoryEdit}
              className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: C.paperRaised, color: C.text, border: `1px solid ${C.borderLight}` }}
            >
              <RotateCcw size={15} /> 다른 제품으로 다시 입력하기
            </button>
          </div>
        )}

        {/* STEP 0.3: 이미 생각해둔 제품/브랜드가 있는지 확인 */}
        {stage === "candidate" && (
          <div className="mt-8">
            <div className="jbmono text-xs mb-2" style={{ color: C.gold }}>STEP 0.3 · 후보 제품 확인</div>
            <h2 className="serif text-xl font-semibold mb-2 leading-snug">"{category}" 중에서 이미 생각해두신 특정 제품이나 브랜드가 있나요?</h2>
            <p className="text-sm mb-6" style={{ color: C.textMuted }}>
              있다면 그 제품이 정말 맞는 선택인지 솔직하게 검증해드리고, 없다면 처음부터 맞춤 추천을 시작할게요.
            </p>

            {!showCandidateInput ? (
              <div className="flex flex-col gap-3">
                <button onClick={() => setShowCandidateInput(true)} disabled={busy}
                  className="text-left px-4 py-3.5 rounded transition-all hover:border-gold" style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}>
                  네, 생각해둔 제품이 있어요
                </button>
                <button onClick={chooseNoCandidate} disabled={busy}
                  className="text-left px-4 py-3.5 rounded transition-all hover:border-gold" style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}>
                  아직 없어요, 처음부터 추천받고 싶어요
                </button>
              </div>
            ) : (
              <div>
                <input
                  value={candidateInput} onChange={(e) => setCandidateInput(e.target.value)}
                  placeholder="예: LG 오브제컬렉션 식기세척기, 삼성 비스포크 무선청소기"
                  className="w-full px-4 py-3 rounded text-base outline-none mb-3"
                  style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
                  autoFocus
                />
                <button
                  onClick={confirmCandidate} disabled={busy || !candidateInput.trim()}
                  className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all"
                  style={{ backgroundColor: busy || !candidateInput.trim() ? C.paperRaised : C.gold, color: busy || !candidateInput.trim() ? C.textDim : "#171310" }}
                >
                  이 제품으로 검증 시작 <ArrowRight size={16} />
                </button>
              </div>
            )}
            {busy && <div className="text-xs mt-4 jbmono flex items-center gap-2" style={{ color: C.textDim }}><Sparkles size={12} className="animate-pulse" /> 진단 준비 중...</div>}
          </div>
        )}

        {/* STEP 0.5: 성별 (카테고리에 따라 조건부로만 등장) */}
        {stage === "gender" && (
          <div className="mt-8">
            <div className="jbmono text-xs mb-2" style={{ color: C.gold }}>STEP 0.5 · 성별 확인</div>
            <h2 className="serif text-xl font-semibold mb-2 leading-snug">"{category}"는 성별에 따라 제품이 달라질 수 있어요</h2>
            <p className="text-sm mb-6" style={{ color: C.textMuted }}>더 정확한 감정을 위해 성별을 알려주시겠어요? (선택 사항)</p>
            <div className="flex flex-col gap-3">
              {["여성", "남성", "응답 안 함"].map((g, i) => (
                <button key={g} onClick={() => selectAndProceed(i, () => answerGender(g))} disabled={busy || selectedIdx !== null}
                  className="text-left px-4 py-3.5 rounded transition-all hover:border-gold"
                  style={{
                    backgroundColor: selectedIdx === i ? C.gold : C.paper,
                    color: selectedIdx === i ? "#171310" : C.text,
                    border: `1px solid ${selectedIdx === i ? C.gold : C.borderLight}`,
                  }}>
                  {g}
                </button>
              ))}
            </div>
            {busy && <div className="text-xs mt-4 jbmono flex items-center gap-2" style={{ color: C.textDim }}><Sparkles size={12} className="animate-pulse" /> 진단 질문 생성 중...</div>}
          </div>
        )}

        {/* STEP 1: 성향 진단 */}
        {stage === "diagnosis" && diagnosis && (
          <div className="mt-8">
            <div className="jbmono text-xs mb-2" style={{ color: C.gold }}>STEP 1 · 소비 성향 진단</div>
            <h2 className="serif text-xl font-semibold mb-6 leading-snug">{diagnosis.question}</h2>
            <div className="flex flex-col gap-3">
              {diagnosis.options.map((opt, i) => (
                <button key={i} onClick={() => selectAndProceed(i, () => answerDiagnosis(opt))} disabled={busy || selectedIdx !== null}
                  className="text-left px-4 py-3.5 rounded transition-all hover:border-gold"
                  style={{
                    backgroundColor: selectedIdx === i ? C.gold : C.paper,
                    color: selectedIdx === i ? "#171310" : C.text,

        {/* STEP 2: 세부 질의응답 */}
        {stage === "answering" && path.length > 0 && (
          <div className="mt-8">
            {fastTrackActive && fastTrackInfo && (
              <div className="flex items-center justify-between gap-2 text-xs px-3 py-2 rounded mb-5" style={{ backgroundColor: `${C.gold}0F`, border: `1px solid ${C.gold}44`, color: C.textMuted }}>

          </div>
        )}

        {/* STEP 2.5: 자유 입력 (선택지로 못 담는 정보 보완) */}
        {stage === "extra" && (
          <div className="mt-8">
            <div className="jbmono text-xs mb-2" style={{ color: C.gold }}>STEP 2.5 · 추가로 알려주고 싶은 점 (선택)</div>
            <h2 className="serif text-xl font-semibold mb-2 leading-snug">앞의 선택지로 다 담지 못한 사정이 있나요?</h2>
            <p className="text-sm mb-4" style={{ color: C.textMuted }}>
              예: 신체 조건, 알레르기, 기존에 쓰던 브랜드, 특별히 피하고 싶은 것 등. 없으면 비워두고 넘어가도 됩니다.
            </p>
            <textarea
              value={extraNote} onChange={(e) => setExtraNote(e.target.value)}
              placeholder="예: 손목이 약해서 무거운 제품은 힘듭니다 / 예전에 A브랜드 써봤는데 소음이 심해서 별로였어요"
              rows={4}
              className="w-full px-4 py-3 rounded text-sm outline-none mb-6 resize-none"
              style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
            />
            <button
              onClick={submitExtraAndAnalyze}
              className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: C.gold, color: "#171310" }}
            >
              감정 시작 <ArrowRight size={16} />
            </button>
          </div>
        )}

        {/* 감정서 생성 실패 → 답변 유지한 채 즉시 재시도 */}
        {stage === "analyzeError" && (
          <div className="mt-16 flex flex-col items-center text-center">
            <AlertCircle size={36} className="mb-4" style={{ color: C.warn }} />
            <div className="serif text-xl font-semibold mb-2">감정서 생성 중 일시적 오류가 발생했어요</div>
            <p className="text-xs mb-8" style={{ color: C.textMuted }}>
              입력하신 답변은 그대로 유지되어 있어요. 질문에 다시 답할 필요 없이 바로 재시도할 수 있습니다.
            </p>
            <button
              onClick={() => finishToAnalysis(pendingAnswers, extraNote)}
              className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all mb-3"
              style={{ backgroundColor: C.gold, color: "#171310" }}
            >
              <RotateCcw size={16} /> 다시 시도
            </button>
            <button
              onClick={reset}
              className="w-full py-3 rounded font-medium transition-all text-xs"
              style={{ backgroundColor: C.paperRaised, color: C.textMuted, border: `1px solid ${C.borderLight}` }}
            >
              처음부터 새로 시작
            </button>
          </div>
        )}

        {/* 분석 중 */}
        {stage === "analyzing" && (
          <div className="mt-20 flex flex-col items-center text-center">
            <FileSearch size={36} className="animate-pulse mb-4" style={{ color: C.gold }} />
            <div className="serif text-xl font-semibold">독립 감정 엔진 작동 중</div>
            <p className="text-xs mt-2" style={{ color: C.textMuted }}>협찬 및 대가성 블로그/유튜브 후기를 필터링하고 실사용 평판을 정밀 검증합니다...</p>
          </div>
        )}

        {/* STEP 3: 티저 / 언락 UX (과금 전환 테스트 시뮬레이션) */}
        {stage === "teaser" && result && (
          <div className="mt-8 text-center p-6 rounded-lg" style={{ backgroundColor: C.paper, border: `1px solid ${C.gold}55` }}>
            <Stamp size={40} className="mx-auto mb-3" style={{ color: C.gold }} />
            <div className="jbmono text-xs mb-1" style={{ color: C.gold }}>ANALYSIS COMPLETE</div>
            <h2 className="serif text-2xl font-semibold mb-2">{category} 맞춤 정밀 감정서 준비 완료</h2>
            {result.opening_line_kr && (
              <p className="text-sm mb-3 leading-relaxed" style={{ color: C.gold }}>{result.opening_line_kr}</p>
            )}
            <p className="text-xs mb-6" style={{ color: C.textMuted }}>
              소비자님의 <span style={{ color: C.text }}>[{buyerType}]</span> 성향과 <span style={{ color: C.text }}>[{buildProfileNote(ageRange, gender)}, {env.size}, {buildHouseholdDescription(env)}]</span> 주거 환경 분석이 완료되었습니다.
            </p>

            <div className="p-4 rounded text-left mb-6 space-y-2 text-xs" style={{ backgroundColor: C.bg, border: `1px solid ${C.border}` }}>
              <div className="flex items-center gap-2" style={{ color: C.verify }}>
                <Check size={14} /> 실사용 후기 {result.reviews_analyzed}건 검증 완결
              </div>
              <div className="flex items-center gap-2" style={{ color: C.verify }}>
                <Check size={14} /> 대가성 협찬 글 {result.ad_filtered_note} 필터링 완료
              </div>
              <div className="flex items-center gap-2" style={{ color: C.verify }}>
                <Check size={14} /> 연간 예상 유지비(TCO) 및 가족 설득 3줄 요약 포함
              </div>
              <div className="flex items-center gap-2" style={{ color: C.gold }}>
                <Lock size={14} /> 광고·제휴 파라미터가 배제된 순수 원본 링크 제공
              </div>
            </div>

            {handsOnInfo && (
              <div className="p-3 rounded text-left text-xs mb-6 flex items-start gap-2" style={{ backgroundColor: `${C.warn}10`, border: `1px solid ${C.warn}44`, color: C.textMuted }}>
                <AlertCircle size={15} className="shrink-0 mt-0.5" style={{ color: C.warn }} />
                <span>
                  <strong style={{ color: C.warn }}>체험 후 최종 결정 권장:</strong> {handsOnInfo.hands_on_reason_kr || "이 카테고리는 사이즈·착용감 등 직접 체험이 중요합니다."} 리뷰 기반 추천은 후보를 좁히는 용도로 참고하시고, 가능하면 매장에서 직접 확인 후 구매하세요.
                </span>
              </div>
            )}

            <div className="text-xs mb-4" style={{ color: C.warn }}>
              * 본 화면은 과금 전환 테스팅용입니다. 아래 버튼을 누르면 비용 없이 정식 보증서가 열람됩니다.
            </div>

            <button
              onClick={unlockReport}
              className="w-full py-4 rounded font-medium text-base flex items-center justify-center gap-2 transition-all"
              style={{ backgroundColor: C.gold, color: "#171310" }}
            >
              <CreditCard size={18} /> 독립 감정서 즉시 언락 (테스트 무료)
            </button>
          </div>
        )}

        {/* STEP 4: 최종 감정 보증서 리포트 */}
        {stage === "result" && result && (
          <div className="mt-6">
            {/* 상단 보증서 헤더 */}
            <div className="p-4 rounded-t-lg flex items-center justify-between border-b" style={{ backgroundColor: C.paperRaised, borderColor: C.borderLight }}>
              <div>
                <div className="jbmono text-xs flex items-center gap-1" style={{ color: C.gold }}>
                  <Stamp size={12} /> 정식 감정 보증서 No. {reportId}
                </div>
                <div className="text-xs text-dim mt-0.5" style={{ color: C.textDim }}>발급: 내편랩 독립 분석 엔진</div>
              </div>
              <button onClick={copyShareLink} className="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded" style={{ backgroundColor: C.paper, color: C.text, border: `1px solid ${C.border}` }}>
                {copied ? <Check size={12} /> : <Share2 size={12} />} {copied ? "복사완료" : "공유"}
              </button>
            </div>

            <div className="p-5 rounded-b-lg mb-6" style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}` }}>
              <h2 className="serif text-2xl font-semibold mb-1">{category} 독립 감정 결과</h2>
              {result.opening_line_kr && (
                <p className="text-sm mb-2 leading-relaxed" style={{ color: C.gold }}>{result.opening_line_kr}</p>
              )}
              <div className="text-xs mb-4" style={{ color: C.textDim }}>
                진단 성향: <span style={{ color: C.text }}>{buyerType}</span> · <span style={{ color: C.text }}>{buildProfileNote(ageRange, gender)}</span> · 환경: <span style={{ color: C.text }}>{env.size}, {buildHouseholdDescription(env)}</span>
              </div>

              {/* 독립성 선언 스탬프 */}
              <div className="text-xs p-3 rounded flex items-start gap-2 mb-6" style={{ backgroundColor: C.bg, border: `1px solid ${C.gold}44` }}>
                <Lock size={15} className="shrink-0 mt-0.5" style={{ color: C.gold }} />
                <div style={{ color: C.textMuted }}>
                  <strong style={{ color: C.gold }}>0% 제휴 선언:</strong> 본 서비스는 추천 대가나 판매 수수료를 받지 않는 유저 직접 과금형 서비스입니다. 구매 링크 역시 어떠한 제휴 파라미터도 없는 원본 링크(Clean URL)만 표시됩니다.
                </div>
              </div>

              {handsOnInfo && (
                <div className="text-xs p-3 rounded flex items-start gap-2 mb-6" style={{ backgroundColor: `${C.warn}10`, border: `1px solid ${C.warn}44` }}>
                  <AlertCircle size={15} className="shrink-0 mt-0.5" style={{ color: C.warn }} />
                  <div style={{ color: C.textMuted }}>
                    <strong style={{ color: C.warn }}>체험 후 최종 결정 권장:</strong> {handsOnInfo.hands_on_reason_kr || "이 카테고리는 사이즈·착용감 등 직접 체험이 중요합니다."} 아래 추천은 후보를 좁히는 참고용이며, 최종 결정 전 매장에서 직접 확인해보시길 권합니다.
                  </div>
                </div>
              )}

              {/* 후보 제품 비교 검증 결과 (비교 모드일 때만) */}
              {candidateProduct && result.verdict_kr && (
                <div className="p-4 rounded-lg mb-6" style={{ backgroundColor: `${C.gold}0F`, border: `1px solid ${C.gold}55` }}>
                  <div className="jbmono text-xs font-semibold mb-2 flex items-center gap-1.5" style={{ color: C.gold }}>
                    <Stamp size={13} /> "{candidateProduct}" 비교 검증 결과
                  </div>
                  <p className="text-sm leading-relaxed" style={{ color: C.text }}>{result.verdict_kr}</p>
                </div>
              )}

              {/* 추천 제품 카드 2개 */}
              <div className="flex flex-col gap-6">
                {result.recommendations.map((rec, i) => (
                  <div key={i} className="rounded-lg p-5 border" style={{ backgroundColor: C.bg, borderColor: C.borderLight }}>
                    <div className="flex items-start justify-between mb-3">
                      <div>
                        <span className="jbmono text-xs px-2 py-0.5 rounded font-semibold" style={{ backgroundColor: rec.is_user_choice ? C.paperRaised : (i === 0 ? C.gold : C.paperRaised), color: rec.is_user_choice ? C.gold : (i === 0 ? "#171310" : C.textMuted), border: rec.is_user_choice ? `1px solid ${C.gold}` : "none" }}>
                          {rec.is_user_choice ? "당신이 고려 중인 제품" : (candidateProduct ? "AI 대안 추천" : (i === 0 ? "최우수 추천 1순위" : "대안 추천 2순위"))}
                        </span>
                        <div className="serif text-xl font-semibold mt-1.5">{rec.name}</div>
                        <div className="text-xs" style={{ color: C.textMuted }}>제조사: {rec.brand}</div>
                      </div>
                      <div className="text-right">
                        <div className="jbmono text-2xl font-bold" style={{ color: C.verify }}>{rec.match_score}<span className="text-xs">%</span></div>
                        <div className="jbmono text-xs" style={{ color: C.textDim }}>적합도</div>
                      </div>
                    </div>

                    <p className="text-sm mb-4 leading-relaxed" style={{ color: C.text }}>{rec.why_kr}</p>

                    {/* TCO 유지비 노트 */}
                    {rec.tco_note_kr && (
                      <div className="mb-3 text-xs p-2.5 rounded flex items-center gap-2" style={{ backgroundColor: C.paper, color: C.gold, border: `1px solid ${C.gold}33` }}>
                        <DollarSign size={14} className="shrink-0" />
                        <span><strong>예상 유지비 (TCO):</strong> {rec.tco_note_kr}</span>
                      </div>
                    )}

                    {/* 단점 & 장점 */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                      <div className="p-3 rounded" style={{ backgroundColor: `${C.warn}10`, border: `1px solid ${C.warn}25` }}>
                        <div className="jbmono text-xs font-semibold mb-1 flex items-center gap-1" style={{ color: C.warn }}>
                          <AlertCircle size={12} /> 솔직 단점/한계
                        </div>
                        {rec.cons_kr.map((p, j) => <div key={j} className="text-xs mb-0.5" style={{ color: C.text }}>· {p}</div>)}
                      </div>
                      <div className="p-3 rounded" style={{ backgroundColor: `${C.verify}08`, border: `1px solid ${C.verify}20` }}>
                        <div className="jbmono text-xs font-semibold mb-1" style={{ color: C.verify }}>검증된 장점</div>
                        {rec.pros_kr.map((p, j) => <div key={j} className="text-xs mb-0.5" style={{ color: C.textMuted }}>· {p}</div>)}
                      </div>
                    </div>

                    {/* 배우자/가족 설득용 3줄 요약 카드 */}
                    {rec.persuasion_3lines && (
                      <div className="p-3 rounded mb-4" style={{ backgroundColor: C.paperRaised, border: `1px solid ${C.borderLight}` }}>
                        <div className="text-xs font-semibold mb-1.5 flex items-center gap-1" style={{ color: C.text }}>
                          <HeartHandshake size={14} style={{ color: C.gold }} /> 배우자/가족 설득용 요약
                        </div>
                        {rec.persuasion_3lines.map((line, k) => (
                          <div key={k} className="text-xs" style={{ color: C.textMuted }}>• {line}</div>
                        ))}
                      </div>
                    )}

                    {/* 원본 구매처 4곳 비교 (0% 수수료) */}
                    <button
                      onClick={() => toggleVendorCompare(i, rec.name)}
                      className="w-full flex items-center justify-between text-xs px-3 py-2.5 rounded transition-all mb-2"
                      style={{ backgroundColor: C.paper, color: C.text, border: `1px solid ${C.borderLight}` }}
                    >
                      <span className="flex items-center gap-1.5"><Store size={13} /> 구매처 4곳 가격 비교 (원본 링크)</span>
                      {openVendor[i] ? <ChevronUp size={13} /> : <ChevronDown size={13} />}
                    </button>

                    {openVendor[i] && (
                      <div className="mt-2 p-3 rounded" style={{ backgroundColor: C.paper }}>
                        <div className="text-xs mb-2 flex items-start gap-1.5" style={{ color: C.textDim }}>
                          <AlertCircle size={12} className="shrink-0 mt-0.5" />
                          <span>AI가 검색으로 찾은 링크라 가끔 페이지가 없어졌거나 이동되었을 수 있어요. 안 열리면 판매처명으로 직접 검색해보세요.</span>
                        </div>
                        {vendorLoading[i] && <div className="text-xs jbmono" style={{ color: C.gold }}>Clean URL 수집 중...</div>}
                        {!vendorLoading[i] && vendorError[i] && !vendorData[i] && (
                          <div className="flex items-center justify-between gap-2 text-xs" style={{ color: C.warn }}>
                            <span className="flex items-center gap-1.5"><AlertCircle size={13} /> {vendorError[i]}</span>
                            <button
                              onClick={() => retryVendorCompare(i, rec.name)}
                              className="px-2 py-1 rounded jbmono"
                              style={{ backgroundColor: C.paperRaised, color: C.text, border: `1px solid ${C.borderLight}` }}
                            >
                              재시도
                            </button>
                          </div>
                        )}
                        {vendorData[i] && (
                          <div className="flex flex-col gap-2">
                            <div className="text-xs mb-1" style={{ color: C.textDim }}>{vendorData[i].sort_basis} · 재고는 검색 시점 기준이며 실시간과 다를 수 있어요</div>
                            {vendorData[i].vendors.map((v, k) => (
                              <div key={k} className="flex items-center justify-between p-2 rounded" style={{ backgroundColor: C.bg, border: `1px solid ${C.border}` }}>
                                <div>
                                  <div className="text-xs font-medium flex items-center gap-1.5">
                                    {v.name}
                                    {v.url_type === "search_results" && (
                                      <span className="jbmono text-xs px-1.5 py-0.5 rounded" style={{ backgroundColor: C.paperRaised, color: C.textDim, border: `1px solid ${C.borderLight}` }}>
                                        검색결과
                                      </span>
                                    )}
                                    {v.stock_status === "likely_out" && (
                                      <span className="jbmono text-xs px-1.5 py-0.5 rounded" style={{ backgroundColor: `${C.warn}18`, color: C.warn, border: `1px solid ${C.warn}44` }}>
                                        품절 가능성
                                      </span>
                                    )}
                                    {v.stock_status === "uncertain" && (
                                      <span className="jbmono text-xs px-1.5 py-0.5 rounded" style={{ backgroundColor: C.paperRaised, color: C.textDim, border: `1px solid ${C.borderLight}` }}>
                                        재고 확인 필요
                                      </span>
                                    )}
                                  </div>
                                  <div className="text-xs" style={{ color: C.textMuted }}>{v.price_krw} · {v.shipping_kr}</div>
                                </div>
                                <a
                                  href={v.url} target="_blank" rel="noopener noreferrer"
                                  className="text-xs px-2.5 py-1 rounded flex items-center gap-1"
                                  style={{ backgroundColor: C.gold, color: "#171310" }}
                                >
                                  {v.url_type === "search_results" ? "검색결과 보기" : "바로가기"} <ExternalLink size={10} />
                                </a>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    <div className="pt-2 text-xs flex items-center justify-between" style={{ color: C.textDim }}>
                      <span>예상 가격대: {rec.price_range_kr}</span>
                      <span className="jbmono" style={{ color: C.verify }}>✓ Clean URL Verified</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <button onClick={reset} className="w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: C.paperRaised, color: C.text, border: `1px solid ${C.borderLight}` }}>
              다른 제품 새로 감정하기
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<AdaptiveAppraisalTest />);
</script>

<!-- 위 text/plain 소스를 실제로 변환하고 실행하는 부분 -->

(function () {
  try {
    const src = document.getElementById("jsx-source").textContent;
    const compiled = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    const runner = document.createElement("script");
    runner.text = compiled;
    document.body.appendChild(runner);

    document.getElementById("root").innerHTML =
      '<div style="color:#EBE8E1;background:#12161B;padding:24px;font-family:sans-serif;white-space:pre-wrap;">앱을 불러오는 중 오류가 발생했습니다:\n' +
      (e && e.message ? e.message : String(e)) +
      "</div>";
    console.error(e);
  }
})();
</script>
