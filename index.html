// ------------------------------------------------------------------
// window.storage 대체 구현 (claude.ai 아티팩트 전용 API를 브라우저의
// localStorage로 흉내낸 것입니다. 실제 저장은 이 브라우저 안에만 됩니다.)
// ------------------------------------------------------------------
(function () {
  const PREFIX = "pureAppraisal:";
  window.storage = {
    async get(key) {
      const raw = window.localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error("Key not found: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      window.localStorage.setItem(PREFIX + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      window.localStorage.removeItem(PREFIX + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf(PREFIX) === 0) {
          const short = k.slice(PREFIX.length);
          if (!prefix || short.indexOf(prefix) === 0) keys.push(short);
        }
      }
      return { keys, prefix, shared: false };
    },
  };
})();
</script>

function extractJson(text) {
  const starts = [];
  for (let i = 0; i < text.length; i++) {
    if (text[i] === "{" || text[i] === "[") starts.push(i);
  }
  if (starts.length === 0) throw new Error("JSON 시작을 찾을 수 없습니다");

  let lastError = null;
  for (const start of starts) {
    const openChar = text[start];
    const closeChar = openChar === "{" ? "}" : "]";
    let depth = 0, inString = false, escape = false;
    for (let i = start; i < text.length; i++) {
      const ch = text[i];
      if (inString) {
        if (escape) escape = false;
        else if (ch === "\\") escape = true;
        else if (ch === '"') inString = false;
        continue;
      }
      if (ch === '"') { inString = true; continue; }
      if (ch === openChar) depth++;
      else if (ch === closeChar) {
        depth--;
        if (depth === 0) {
          const candidate = text.slice(start, i + 1);
          // 괄호는 맞아떨어져도 실제 유효한 JSON인지 검증 — 아니면 다음 괄호 시작점으로 넘어감
          // (예: 본문 설명 중의 "[기본제품]" 같은 자연어 대괄호를 JSON으로 오인하는 것 방지)
          try {
            JSON.parse(candidate);
            return candidate;
          } catch (e) {
            lastError = e;
          }
          break;
        }
      }
    }
  }
  throw new Error(`유효한 JSON을 찾을 수 없습니다${lastError ? ": " + lastError.message : ""}`);
}

async function callClaude(prompt, useSearch, maxTokens, useFetch, onProgress, systemPrompt) {
  // [실시간 진행 상황 표시] onProgress 콜백이 있으면 스트리밍 경로로 처리한다.
  // 검색을 시작하는 순간을 그대로 화면에 알려줄 수 있어서, 오래 걸리는 호출에서
  // "지금 뭘 하고 있는지" 실제로 보여줄 수 있다. 비용에는 영향 없음(응답 수신 방식만 변경).
  if (onProgress) {
    return callClaudeStreaming(prompt, useSearch, maxTokens, onProgress, systemPrompt);
  }
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: maxTokens || 1500,
    messages: [{ role: "user", content: prompt }],
  };
  // [프롬프트 캐싱] 카테고리·사용자별로 매번 바뀌지 않는 고정 지시문(역할 정의, JSON
  // 스키마, 일반 규칙 등)은 system 필드에 넣고 cache_control로 캐시 지점을 표시한다.
  // 같은 system 프롬프트로 다시 호출되면(다른 사용자여도 상관없이) 이 부분은
  // 90% 할인된 캐시 읽기 요금으로 처리된다. 최소 1,024토큰은 넘어야 캐시가 걸린다.
  if (systemPrompt) {
    body.system = [{ type: "text", text: systemPrompt, cache_control: { type: "ephemeral" } }];
  }
  const tools = [];
  // [원가 절감] 검색 횟수 상한을 걸어 무제한 검색으로 비용이 불어나는 것을 방지합니다.
  // 리뷰 조사에는 보통 3~4회면 충분해서 품질 저하는 거의 없습니다.
  if (useSearch) tools.push({ type: "web_search_20250305", name: "web_search", max_uses: 4 });
  if (useFetch) tools.push({ type: "web_fetch_20250910", name: "web_fetch", max_uses: 5, max_content_tokens: 6000 });
  if (tools.length > 0) body.tools = tools;
  const res = await fetch("https://api.getkindman.com", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) {
    const err = new Error(`API 오류: ${data.error.message || JSON.stringify(data.error)}`);
    err.errorType = data.error.type || null; // 예: permission_error, overloaded_error, rate_limit_error, authentication_error
    err.httpStatus = res.status;
    throw err;
  }
  const textBlocks = (data.content || []).filter((b) => b.type === "text").map((b) => b.text);
  if (textBlocks.length === 0) throw new Error("응답에 텍스트가 없습니다");

  const candidates = [...textBlocks].reverse().concat([textBlocks.join("\n")]);
  let lastError = null;
  for (const candidate of candidates) {
    try {
      const jsonStr = extractJson(candidate);
      return JSON.parse(jsonStr);
    } catch (e) {
      lastError = e;
    }
  }
  throw new Error(`JSON 파싱 실패: ${lastError?.message || "알 수 없는 오류"}`);
}

// [실시간 진행 상황 표시] Claude 응답을 스트리밍(SSE)으로 받아서, 검색을 시작하는
// 순간마다 onProgress로 실제 진행 상황을 그대로 전달한다.
// 비용에는 영향 없음 — 응답을 "받는 방식"만 스트리밍으로 바뀌는 것이고, 실제 검색
// 횟수·토큰 사용량은 비스트리밍 호출과 완전히 동일하다.
async function callClaudeStreaming(prompt, useSearch, maxTokens, onProgress, systemPrompt) {
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: maxTokens || 1500,
    stream: true,
    messages: [{ role: "user", content: prompt }],
  };
  if (systemPrompt) {
    body.system = [{ type: "text", text: systemPrompt, cache_control: { type: "ephemeral" } }];
  }
  const tools = [];
  if (useSearch) tools.push({ type: "web_search_20250305", name: "web_search", max_uses: 4 });
  if (tools.length > 0) body.tools = tools;

  const res = await fetch("https://api.getkindman.com", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  if (!res.ok || !res.body) {
    let errText = "";
    try { errText = await res.text(); } catch (e) {}
    let errObj = null;
    try { errObj = JSON.parse(errText); } catch (e) {}
    const err = new Error(`API 오류: ${(errObj && errObj.error && errObj.error.message) || errText || "스트리밍 연결 실패"}`);
    err.errorType = (errObj && errObj.error && errObj.error.type) || null;
    err.httpStatus = res.status;
    throw err;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let fullText = "";
  let searchCount = 0;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop() || "";

    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      const jsonStr = line.slice(5).trim();
      if (!jsonStr) continue;
      let evt;
      try { evt = JSON.parse(jsonStr); } catch (e) { continue; }

      if (evt.type === "error") {
        const err = new Error(`API 오류: ${(evt.error && evt.error.message) || "스트리밍 중 오류"}`);
        err.errorType = (evt.error && evt.error.type) || null;
        throw err;
      }
      // Claude가 실제로 web_search 도구 호출을 "시작"하는 순간을 그대로 감지한다.
      // (server_tool_use 블록의 시작 = 검색 한 번이 실제로 시작됐다는 신호)
      if (evt.type === "content_block_start" && evt.content_block) {
        const cb = evt.content_block;
        if (cb.type === "server_tool_use" && cb.name === "web_search") {
          searchCount += 1;
          if (onProgress) onProgress({ type: "search", count: searchCount });
        }
      }
      if (evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta") {
        fullText += evt.delta.text;
      }
    }
  }

  if (!fullText) throw new Error("응답에 텍스트가 없습니다");
  const jsonStr = extractJson(fullText);
  return JSON.parse(jsonStr);
}

// 재시도해도 소용없는 오류 (설정/권한 문제로, 다시 시도해도 똑같이 실패함) → 즉시 실패 처리
const NON_RETRYABLE_ERROR_TYPES = new Set(["authentication_error", "not_found_error", "invalid_request_error"]);
// 서버 쪽 순간적인 문제로 확인된 오류 → 더 적극적으로 재시도
const TRANSIENT_ERROR_TYPES = new Set(["permission_error", "overloaded_error", "rate_limit_error", "api_error"]);

async function callClaudeAutoRetry(prompt, useSearch, maxTokens, attempt = 1, useFetch, onProgress, systemPrompt) {
  try {
    return await callClaude(prompt, useSearch, maxTokens, useFetch, onProgress, systemPrompt);
  } catch (e) {
    const isNonRetryable = e.errorType && NON_RETRYABLE_ERROR_TYPES.has(e.errorType);
    const isKnownTransient = e.errorType && TRANSIENT_ERROR_TYPES.has(e.errorType);
    // web_fetch를 쓰는 호출은 재시도할 때마다 웹검색+최대 여러 페이지 fetch를 통째로 다시 하므로
    // 비용/시간이 거의 2배씩 뛴다 (실측: 1회 실패 후 재시도로 $3.26, 200초 소진).
    // 자동 재시도는 아예 하지 않고, 실패하면 사용자가 수동으로 "재시도" 버튼을 누르게 한다.
    const maxAttempts = useFetch ? 1 : (isKnownTransient ? 6 : 3);

    if (isNonRetryable || attempt >= maxAttempts) throw e;

    const isTruncated = String(e.message || "").includes("max_tokens");
    const nextTokens = isTruncated ? Math.min(maxTokens * 2, 8192) : maxTokens;
    // 알려진 일시적 오류는 조금 더 여유 있게 기다렸다가 재시도 (서버 쪽 순간 과부하가 풀릴 시간을 줌)
    const backoff = (isKnownTransient ? 1200 : 900) * attempt;
    await new Promise((r) => setTimeout(r, backoff));
    return callClaudeAutoRetry(prompt, useSearch, nextTokens, attempt + 1, useFetch, onProgress, systemPrompt);
  }
}

async function checkCategoryMeta(category) {
  const groupList = CATEGORY_GROUPS.join(", ");
  const prompt = `당신은 "내편랩"이라는 서비스의 입력 검증 담당입니다. 아래 세 가지를 한 번에 판단하세요.

[1] 범위 판정
이 서비스는 오직 다음 조건을 모두 만족하는 "실물 소비재 제품" 카테고리만 다룰 수 있습니다:
- 특정 브랜드/모델명이 존재하고 여러 제조사 제품 중 하나를 골라야 하는 것
- 온라인/오프라인 판매처에서 정가를 주고 구매하는 물건 (배송받거나 매장에서 수령하는 유형의 물건)
- 여러 판매처 가격 비교, AS/반품 정책 비교가 실제로 의미 있는 것
범위 밖(false) 예시: 해외여행, 국내여행지, 여행자보험, 각종 보험 상품, 금융상품(예금/적금/펀드/대출), 이사/시공/인테리어 같은 시공 서비스, 학원/과외/강의, 구독형 디지털 서비스(OTT, 소프트웨어 구독), 병원/의료 시술, 웨딩/이벤트 서비스, 부동산(전월세/매매), 취업/이직 관련.
범위 안(true) 예시: 정수기(렌탈이어도 실물 기기를 고르는 것이므로 true), 무선청소기, 매트리스, 스마트폰, 노트북, 가구, 유모차, 안마의자, 자동차(신차/중고차 모델 선택), 화장품.
애매하면(예: "명절 선물세트"처럼 실물이지만 브랜드 비교 의미가 약한 경우) false 쪽으로 판단하세요.

[2] 체험 필요 여부
"직접 몸으로 체험(착용감, 사이즈, 그립감, 타격감, 승차감 등)해봐야 제대로 판단되는 제품"인지 판단하세요.
체험 필요(true) 예시: 매트리스, 신발, 골프클럽, 안마의자, 자동차, 이어폰(착용감 중요 모델), 의자, 등산화, 자전거(사이즈).
체험 불필요(false) 예시: 무선청소기, 식기세척기, 냉장고, 전자레인지, 정수기, 스마트폰.

[3] 성별 관련성
구매자의 성별에 따라 제품 스펙/선택 자체가 달라지는 카테고리인지 판단하세요.

    : "";
  const configRule = `\n4. "${category}"에서 구매 결정에 핵심적인 "판매 단위 구조"가 있는지 판단하고, 있다면 정확히 1개의 질문으로 확인하며 "config_check": true로 표시하세요. 아래 두 유형 중 이 카테고리에 해당하는 쪽을 판단하세요:
   (a) 사이즈/용량/규격 축 — 한번 정해지면 나중에 바꾸기 어렵고 구매 결정에 필수적인 경우 (예: 캐리어의 기내용/24인치/28인치, 매트리스의 SS/Q/K, 신발의 발사이즈, 자전거의 프레임 사이즈). 이 축이 존재하면 반드시 이것을 질문하세요. options는 그 카테고리에서 실제로 존재하는 사이즈/용량 구분이어야 합니다.
   (b) 세트/번들 개수 축 — 몇 개가 묶여서 판매되는지가 갈리는 경우 (예: 골프 아이언 단품 1개 vs 5~8개 세트, 타이어 1개 vs 4개 세트, 침구 단품 vs 풀세트).
   (a)와 (b)가 둘 다 해당되는 카테고리라면 (a) 사이즈/용량 쪽을 우선하세요 — 사이즈가 안 맞으면 아예 못 쓰지만, 개수는 나중에 판매처에서 직접 보고 조절 가능한 경우가 많습니다.

   (a), (b) 둘 다 해당 없는 카테고리(예: 무선청소기, 냉장고)라면 이 질문은 생략하세요.`;
  const prompt = `"${category}" 구매를 고민 중이며 성향은 "${buyerType}", 구매자 정보는 "${profileNote}", 환경은 "${env.size}, ${householdDesc}"인 사람에게 물어볼 질문 경로를 만드세요.

반드시 지켜야 할 규칙:

3. 나머지 질문들은 "${category}"라는 카테고리 고유의 의사결정 요소를 반영해야 합니다 (예: 스마트폰이면 운영체제/생태계, 카메라·배터리 우선순위, 저장용량; 가전이면 설치방식·소음·용량; 가구면 사이즈·소재 등). 카테고리와 무관한 뻔한 질문은 피하세요.${configRule}${candidateRule}

다른 설명 없이 JSON 배열로만 응답, 정확히 6개 항목:
[{"question": "...", "options": ["...","...","...","..."], "regret_check": false, "budget_check": false, "candidate_check": false, "config_check": false}]`;
  return callClaudeAutoRetry(prompt, false, 1500);
}

async function generateRecommendation(category, buyerType, env, qa, ageRange, gender, extraNote, history, candidateProduct, fastTrackInfo, nickname, onProgress) {

  const configEntry = qa.find((x) => x.config_check);
  const qaText = qa.map((x, i) => `${i + 1}. ${x.question} → ${x.answer}`).join("\n");
  const extraText = extraNote && extraNote.trim() ? `\n\n[사용자가 직접 추가로 남긴 메모]\n${extraNote.trim()}\n이 메모에 담긴 제약조건(신체조건, 특수 상황 등)이 있다면 반드시 추천에 반영하세요.` : "";
  const budgetInstruction = budgetEntry
    ? `사용자가 명시적으로 선택한 예산대는 "${budgetEntry.answer}"입니다. 이 예산대는 절대적 하드 제약조건입니다 — 소비 성향이 "${buyerType}"이더라도 이 예산대를 벗어난(특히 임의로 더 저렴한) 제품을 추천하지 마세요. 두 추천 제품의 실제 가격이 이 구간 안(또는 바로 인접한 범위)에 들어와야 합니다.`

  const candidateInstruction = candidateProduct
    ? `
이 사용자는 이미 "${candidateProduct}"를 구매 후보로 염두에 두고 있습니다 (구체적 우려사항: "${candidateEntry ? candidateEntry.answer : "명시 없음"}").
이건 발견 모드가 아니라 비교/검증 모드입니다. 반드시 아래 규칙을 지키세요:
1. recommendations의 첫 번째 항목은 "${candidateProduct}" 자체에 대한 정직한 평가여야 합니다 (name은 정확히 "${candidateProduct}"). 웹 검색으로 실제 후기를 찾아 진짜 장단점을 밝히세요. 사용자를 기분 좋게 하려고 장점을 과장하거나 단점을 숨기지 마세요.
2. recommendations의 두 번째 항목은 그 대안이 될 만한 다른 제품 1개입니다. 만약 "${candidateProduct}"가 이미 최선의 선택이라고 판단되면, 두 번째 항목은 "그래도 비교해볼 만한 대안"으로서 정직하게 왜 후보만 못한지 설명하세요. 반대로 대안이 실제로 더 낫다면 그 이유를 분명히 밝히세요.
3. 최상위 필드로 "verdict_kr"를 추가하세요: "${candidateProduct}"와 대안을 직접 비교해서 이 사용자에게 어느 쪽이 더 맞는지 솔직하게 결론 내리는 3~4문장. 무조건 후보를 지지하거나 무조건 대안을 추천하지 말고, 근거에 기반해 판단하세요. 사용자 기분을 맞추기 위한 눈치보기 없이 사실대로 말하세요.`
    : `
최상위 필드로 "verdict_kr"는 null로 응답하세요 (비교 후보가 없으므로 사용 안 함).`;

  const fastTrackInstruction = fastTrackInfo
    ? `\n이 사용자는 과거 유사 이력 ${fastTrackInfo.matched_count || 2}건을 바탕으로 "빠른 진단 모드"로 진행되었습니다. 최상위 필드로 "opening_line_kr"을 추가하세요: "${nickname ? `${nickname}님, ` : ""}[이 사람이 이 유형 제품에서 일관되게 중요시해온 것: ${fastTrackInfo.pattern_summary_kr || ""}]을(를) 중요시하는 당신께 추천하는 제품은" 으로 시작하는 자연스러운 1문장.`
    : `\n최상위 필드로 "opening_line_kr"은 null로 응답하세요 (빠른 진단 모드가 아니므로 사용 안 함).`;

  const configInstruction = configEntry
    ? `\n구매 단위/구성 규칙 (매우 중요): 사용자가 "${configEntry.answer}"라고 명확히 답했습니다. recommendations의 "name"에는 이 구성(개수/세트 여부 등)을 명확히 포함시키세요 (예: 단품이면 제품명만, 세트면 "OO 8개 세트"처럼 명시). "price_range_kr"는 반드시 이 정확한 구성 기준의 실제 시장 가격이어야 합니다 — 절대로 다른 구성(예: 단품 가격인데 세트인 것처럼, 혹은 그 반대로)의 가격을 섞어서 제시하지 마세요.`
    : "";

  const answerGroundingCount = `\n위 ${qa.length}개 질문-답변 전부가 이 사람이 실제로 준 정보입니다. 예산만 반영하고 나머지 답변을 장식처럼 취급하지 마세요.`;

  // ── 가변부(user 메시지): 이번 사용자·이번 세션에서만 유효한 정보 ──
  // 카테고리, 성향, 환경, 실제 질문-답변, 예산/후보/빠른진단/구성 같은 조건부 지시문 등
  // 매 세션 달라지는 내용만 여기 담는다. 캐시 대상이 아니므로 매번 정상 과금된다.
  const prompt = `"${category}" 구매 고민자(성향: ${buyerType}, ${profileNote}, 주거환경: ${env.size}, 가구형태: ${householdDesc})의 분석 정보입니다:
${qaText}
${extraText}

${budgetInstruction}${historyNote}
${candidateInstruction}
${fastTrackInstruction}
${configInstruction}
${answerGroundingCount}

위 조건과 답변을 바탕으로, system 지시사항에 정의된 JSON 형식 그대로 응답하세요.`;

  return callClaudeAutoRetry(prompt, true, 4096, 1, false, onProgress, RECOMMENDATION_SYSTEM_PROMPT);
}

// 판매처 비교: 이제 Claude의 web_fetch 도구로 페이지를 순차 열람하지 않고,
// Worker가 후보 페이지들을 직접 병렬로 가져와 요약한 뒤 단일 턴으로 최종 판단만 받습니다.
// (구성 일치 규칙, 신품/중고 구분, 판매불가 판정 로직 등은 Worker의 buildFinalVendorPrompt에서 동일하게 적용됩니다.)
async function generateVendorComparison(productName, officialMallUrl, includeOverseas, priceRangeKr) {
  const res = await fetch("https://api.getkindman.com", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "vendor_compare", productName, officialMallUrl, includeOverseas, priceRangeKr }),
  });
  const data = await res.json();
  if (data.error) {
    throw new Error(`판매처 비교 실패: ${data.error}`);
  }
  if (data._debug) {
    console.log("[판매처 비교 진단]", data._debug);
  }
  return data;
}

// 제품 실존 여부를 가볍게(검색 1회) 확인합니다. 추천이 만들어진 직후 호출됩니다.
// 제품 실존 여부 + 예산 부합 여부를 가볍게 확인합니다. 추천이 만들어진 직후 호출됩니다.
// [원가 절감] 제품이 여러 개여도 API 호출을 나누지 않고 한 번에 같이 확인합니다 (Worker 쪽에서 Haiku로 처리).
async function checkProductsExist(productNames, budgetText) {
  const res = await fetch("https://api.getkindman.com", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "check_exists", productNames, budgetText }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// 추천 제품이 (1) 실존하는지, (2) 실제 가격이 사용자가 고른 예산대에 부합하는지 가볍게
// 확인하고, 문제가 있으면 그 사실을 알려주며 딱 한 번만 재생성한다. (비용 폭주 방지를 위해 재시도는 최대 1회)
async function ensureRecommendationsExist(result, category, buyerType, env, qaList, ageRange, gender, extraNote, history, candidateProduct, fastTrackInfo, nickname, onProgress, attempt = 1) {
  if (!result || !Array.isArray(result.recommendations)) return result;
  try {
    const names = result.recommendations.map((rec) => rec.name);
    const budgetEntry = qaList.find((x) => x.budget_check);
    const budgetText = budgetEntry ? budgetEntry.answer : null;
    const checkResult = await checkProductsExist(names, budgetText).catch(() => ({ results: names.map(() => ({ exists: true })) }));
    const results = Array.isArray(checkResult.results) ? checkResult.results : [];

    // 공식몰에서 확인된 URL을 추천 결과에 붙여둔다 — 이후 판매처 비교에서 최우선 후보로 사용된다.
    result.recommendations = result.recommendations.map((rec, i) => (
      results[i] && results[i].official_mall_url
        ? { ...rec, officialMallUrl: results[i].official_mall_url }
        : rec
    ));

    const nonExistentNames = result.recommendations
      .map((rec, i) => (results[i] && results[i].exists === false ? rec.name : null))
      .filter(Boolean);
    const overBudgetNames = result.recommendations
      .map((rec, i) => (results[i] && results[i].exists === true && results[i].budget_fit === false ? `${rec.name} (확인된 가격: ${results[i].observed_price_krw || "미상"})` : null))
      .filter(Boolean);

    if ((nonExistentNames.length === 0 && overBudgetNames.length === 0) || attempt >= 2) return result;

    const noteParts = [extraNote || ""];
    if (nonExistentNames.length > 0) {
      noteParts.push(`[내부 검증 결과] 아래 제품명은 실존 여부가 확인되지 않았으니 절대 다시 추천하지 마세요: ${nonExistentNames.join(", ")}`);
    }
    if (overBudgetNames.length > 0) {
      noteParts.push(`[내부 검증 결과] 아래 제품은 실제 확인된 가격이 사용자가 선택한 예산대("${budgetText}")를 명백히 벗어났습니다. 반드시 그 예산대 안에 실제로 들어오는 다른 제품으로 교체하세요: ${overBudgetNames.join(", ")}`);
    }
    const avoidNote = noteParts.join("\n\n");
    const retryResult = await generateRecommendation(category, buyerType, env, qaList, ageRange, gender, avoidNote, history, candidateProduct, fastTrackInfo, nickname, onProgress);
    return ensureRecommendationsExist(retryResult, category, buyerType, env, qaList, ageRange, gender, avoidNote, history, candidateProduct, fastTrackInfo, nickname, onProgress, attempt + 1);
  } catch (e) {
    return result; // 검증 자체가 실패해도 서비스는 막지 않음
  }
}

// AI가 예산 질문(budget_check)을 빠뜨렸을 경우를 대비한 안전장치.
// 이미 있으면 그대로 두고, 없으면 즉시(추가 API 호출 없이) 일반적인 4단계 가격대 질문을 만들어 채워 넣습니다.
function ensureBudgetQuestion(path) {
  if (!Array.isArray(path)) return path;
  const hasBudget = path.some((q) => q && q.budget_check);
  if (hasBudget) return path;
  const fallbackBudgetQuestion = {
    question: "생각하고 계신 예산대는 어느 정도인가요?",
    options: ["최대한 저렴하게", "합리적인 가격대", "품질 우선, 다소 비싸도 괜찮음", "예산 상관없이 최고급으로"],
    regret_check: false,
    budget_check: true,
    candidate_check: false,
  };
  // 마지막 질문 대신 넣어서 전체 질문 개수는 유지
  return [...path.slice(0, -1), fallbackBudgetQuestion];
}

        matched.forEach((h) => { if (h.budgetAnswer) budgetCounts[h.budgetAnswer] = (budgetCounts[h.budgetAnswer] || 0) + 1; });
        const budgetKeys = Object.keys(budgetCounts);
        const typicalBudget = budgetKeys.length ? budgetKeys.sort((a, b) => budgetCounts[b] - budgetCounts[a])[0] : null;

        const ft = {
          fast_track: true,
          matched_count: matched.length,
          inferred_buyer_type: inferredType,
          typical_budget_hint_kr: typicalBudget,
          pattern_summary_kr: `${inferredType}${typicalBudget ? `, 보통 ${typicalBudget}` : ""}`,
        };

        setFastTrackActive(true);
        setFastTrackInfo(ft);
        setBuyerType(inferredType);
        const p = await generateFastPath(category.trim(), inferredType, env, ageRange, gender, candidateProduct, ft);
        setPath(ensureBudgetQuestion(p));
        setQIndex(0);
        setAnswersByIndex({});
        setStage("answering");
        setBusy(false);
        return;
      }

      setFastTrackActive(false);
      setFastTrackInfo(null);
      const d = await generateDiagnosis(category.trim(), env, ageRange, gender, history, candidateProduct);
      setDiagnosis(d);
      setStage("diagnosis");
    } catch (e) { setError(`유형 진단 질문 생성 중 오류: ${e.message}`); }
    setBusy(false);
  };

  const switchToFullDiagnosis = async () => {
    setBusy(true); setError(null);
    setFastTrackActive(false); setFastTrackInfo(null);
    try {
      const d = await generateDiagnosis(category.trim(), env, ageRange, gender, history, candidateProduct);
      setDiagnosis(d);
      setStage("diagnosis");
    } catch (e) { setError(`유형 진단 질문 생성 중 오류: ${e.message}`); }
    setBusy(false);
  };

  const startCategory = async () => {
    if (!category.trim()) return;
    setError(null);
    setBusy(true);
    try {
      const meta = await checkCategoryMeta(category.trim());
      if (meta && meta.in_scope === false) {
        setScopeInfo(meta);
        setStage("outOfScope");
        setBusy(false);
        return;
      }
      if (meta) {
        setHandsOnInfo(meta.hands_on_recommended ? meta : null);
        setGenderApplicable(!!meta.gender_relevant);
        setPendingGroup(meta.category_group || "기타");
      }
    } catch (e) {
      // 범위 판별 자체가 실패하면 서비스 흐름을 막지 않고 통과시킴
      setHandsOnInfo(null);
      setGenderApplicable(false);
      setPendingGroup("기타");
    }
    saveProfile({ nickname, ageRange });
    setBusy(false);
    setStage("candidate");
  };

  const backToCategoryEdit = () => {
    setScopeInfo(null);
    setStage("category");
  };

  const afterCandidateDecision = () => {
    setError(null);
    if (genderApplicable) {
      setStage("gender");
      return;
    }
    setBusy(true);
    proceedToDiagnosis();
  };

  const chooseNoCandidate = () => {
    setHasCandidate(false); setCandidateProduct(""); setGender(null);
    afterCandidateDecision();
  };

  const confirmCandidate = () => {
    if (!candidateInput.trim()) return;
    setHasCandidate(true); setCandidateProduct(candidateInput.trim()); setGender(null);
    afterCandidateDecision();
  };

  const answerGender = async (g) => {
    setGender(g);
    setBusy(true); setError(null);
    await proceedToDiagnosis();
  };

  const answerDiagnosis = async (opt) => {
    setBusy(true); setError(null);
    setBuyerType(opt.type);
    try {
      const p = await generatePath(category.trim(), opt.type, env, ageRange, gender, candidateProduct);
      setPath(ensureBudgetQuestion(p));
      setQIndex(0);
      setAnswersByIndex({});
      setStage("answering");
    } catch (e) { setError("질문 경로 생성 중 오류가 발생했습니다."); }
    setBusy(false);
  };

  const finishToAnalysis = async (finalAnswers, note) => {
    setStage("analyzing"); setError(null);
    setAnalyzingStage("실사용 후기를 검색할 준비를 하고 있어요...");
    setOpenVendor({}); setVendorData({}); setVendorLoading({}); setVendorError({});
    const qaList = path
      .map((q, i) => (i in finalAnswers ? { question: q.question, answer: finalAnswers[i], budget_check: !!q.budget_check, candidate_check: !!q.candidate_check, config_check: !!q.config_check } : null))
      .filter(Boolean);
    const onSearchProgress = (progress) => {
      if (progress.type === "search") {
        setAnalyzingStage(`실사용 후기 검색 중... (${progress.count}번째 검색)`);
      }
    };
    try {
      let r = await generateRecommendation(category.trim(), buyerType, env, qaList, ageRange, gender, note, history, candidateProduct, fastTrackActive ? fastTrackInfo : null, nickname, onSearchProgress);
      setAnalyzingStage("추천 제품이 실제로 존재하는지, 예산에 맞는지 확인하고 있어요...");
      r = await ensureRecommendationsExist(r, category.trim(), buyerType, env, qaList, ageRange, gender, note, history, candidateProduct, fastTrackActive ? fastTrackInfo : null, nickname, onSearchProgress);
      setResult(r);
      setReportId(genId());
      setStage("result"); // 결제는 이미 완료된 상태이므로 티저 없이 바로 결과로 이동
      unlockAndFetchAllVendors(r); // 판매처 비교(추천1·2+대안)도 자동으로 같이 시작
      const budgetEntry = qaList.find((x) => x.budget_check);
      const newHistory = [...history, { category: category.trim(), categoryGroup: pendingGroup || "기타", buyerType, budgetAnswer: budgetEntry ? budgetEntry.answer : "", date: new Date().toISOString().slice(0, 10) }].slice(-MAX_HISTORY);
      setHistory(newHistory);
      saveProfile({ history: newHistory });
    } catch (e) {
      setError(`감정서 생성 중 오류: ${e.message}`);
      setStage("analyzeError");
    }
  };

  const answerCurrent = (opt) => {
    const newAnswers = { ...answersByIndex, [qIndex]: opt };
    setAnswersByIndex(newAnswers);
    if (qIndex + 1 < path.length) {
      setQIndex(qIndex + 1);
    } else {
      setPendingAnswers(newAnswers);
      setExtraNote("");
      setStage("extra");
    }
  };

  // [결제 시점 변경] 예전엔 "감정 시작" 버튼을 누르면 곧바로 검색(가장 비싼 단계)이
  // 시작되고, 검색이 다 끝난 뒤에야 결제 유도 화면(teaser)이 떴다 — 이미 가장 비싼 걸
  // 다 써버린 뒤에 결제를 권하는 셈이라 무료 사용자에게도 매번 원가가 나가는 구조였다.
  // 이제 "감정 시작" 버튼은 검색을 바로 실행하지 않고 결제 유도 화면(paywall)으로만
  // 이동한다. 실제 검색은 결제 확인(startPaidAnalysis) 이후에만 시작된다 — 질문
  // 답변 단계까지는 원가가 세션당 100원이 안 되므로, 결제 전 이탈에 대한 부담이 거의 없다.
  const submitExtraAndAnalyze = () => {
    setStage("paywall");
  };

  // 결제(현재는 테스트 스텁 — 실제 결제 연동 시 이 함수를 결제 성공 콜백에서 호출하면 됨)
  // 확인 후에만 검색을 시작한다.
  const startPaidAnalysis = () => {
    finishToAnalysis(pendingAnswers, extraNote);
  };

  // 검색+진단(finishToAnalysis)이 끝나면, 이미 결제가 완료된 상태이므로 판매처 비교
  // (추천1·추천2·대안)도 별도 결제 없이 바로 자동으로 시작한다 — startPaidReport와
  // 로직은 같지만, React state(result)가 아직 갱신되지 않았을 수 있는 시점이라 방금
  // 받은 결과(r)를 직접 인자로 받아 사용한다.
  const unlockAndFetchAllVendors = (r) => {
    setPaidReportOpen(true);
    if (!r || !Array.isArray(r.recommendations)) return;
    // 결제 화면에서 미리 받은 해외직구 선호도를 추천1·2·대안 전부에 동일하게 적용해서
    // 첫 검색부터 반영한다 — 검색 후 다시 켜서 재검색이 걸리는 일을 없앤다.
    const initialOverseas = {};
    r.recommendations.forEach((_, idx) => { initialOverseas[idx] = overseasPreference; });
    setIncludeOverseas(initialOverseas);
    r.recommendations.forEach((rec, idx) => {
      fetchVendorData(idx, rec.name, rec.officialMallUrl, overseasPreference, rec.price_range_kr);
    });
  };

  const fetchVendorData = async (recIndex, productName, officialMallUrl, overseasFlag, priceRangeKr) => {
    setVendorLoading((prev) => ({ ...prev, [recIndex]: true }));
    setVendorError((prev) => ({ ...prev, [recIndex]: null }));
    setVendorElapsed((prev) => ({ ...prev, [recIndex]: 0 }));
    const timer = setInterval(() => {
      setVendorElapsed((prev) => ({ ...prev, [recIndex]: (prev[recIndex] || 0) + 1 }));
    }, 1000);
    try {
      const v = await generateVendorComparison(productName, officialMallUrl, !!overseasFlag, priceRangeKr);
      setVendorData((prev) => ({ ...prev, [recIndex]: v }));
    } catch (e) {
      setVendorError((prev) => ({ ...prev, [recIndex]: `구매처 조회 실패: ${e.message}` }));
    }
    clearInterval(timer);
    setVendorLoading((prev) => ({ ...prev, [recIndex]: false }));
  };

  const toggleVendorCompare = (recIndex, productName, officialMallUrl, priceRangeKr) => {
    setOpenVendor((prev) => ({ ...prev, [recIndex]: !prev[recIndex] }));
    if (vendorData[recIndex] || vendorLoading[recIndex]) return;
    fetchVendorData(recIndex, productName, officialMallUrl, includeOverseas[recIndex], priceRangeKr);
  };

  const retryVendorCompare = (recIndex, productName, officialMallUrl, priceRangeKr) => {
    fetchVendorData(recIndex, productName, officialMallUrl, includeOverseas[recIndex], priceRangeKr);
  };

  // 해외 직구 포함 여부를 바꾸면, 이미 열려있던 결과는 새 기준으로 다시 조회한다.
  const toggleIncludeOverseas = (recIndex, productName, officialMallUrl, checked, priceRangeKr) => {
    setIncludeOverseas((prev) => ({ ...prev, [recIndex]: checked }));
    if (vendorData[recIndex] || vendorLoading[recIndex]) {
      fetchVendorData(recIndex, productName, officialMallUrl, checked, priceRangeKr);
    }
  };

  const copyShareLink = () => {
    navigator.clipboard.writeText(`[내편랩 독립 감정서] ${category} 추천 결과 (${reportId})`);
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: C.bg, color: C.text, fontFamily: "'Source Sans 3', sans-serif" }}>
      <style>{`
        .serif { font-family: 'Source Serif 4', serif; }
        .jbmono { font-family: 'JetBrains Mono', monospace; }
      `}</style>

      {/* 헤더 */}
      <div className="px-6 pt-6 pb-4 flex items-center justify-between max-w-2xl mx-auto border-b" style={{ borderColor: C.border }}>
        <div className="flex items-center gap-2">
          <ShieldCheck size={22} style={{ color: C.gold }} />
          <span className="serif text-lg font-semibold">내편랩 · MySide Lab</span>
        </div>
        {stage !== "category" && (
          <button onClick={reset} className="flex items-center gap-1 text-xs jbmono" style={{ color: C.textDim }}>
            <RotateCcw size={12} /> 새로 진단
          </button>
        )}
      </div>

      <div className="max-w-2xl mx-auto px-6 pb-16">
        {error && (
          <div className="mt-4 px-3 py-2 rounded text-sm flex items-center gap-2" style={{ backgroundColor: `${C.warn}18`, color: C.warn, border: `1px solid ${C.warn}44` }}>
            <AlertCircle size={16} /> {error}
          </div>
        )}

        {/* STEP 0: 카테고리 & 환경 설정 */}
        {stage === "category" && (
          <div className="mt-8">
            <div className="text-xs jbmono tracking-widest mb-2" style={{ color: C.gold }}>INDEPENDENT PAID APPRAISAL</div>
            <h1 className="serif text-2xl font-semibold leading-snug mb-2">구매 고민 중인 제품을 입력하세요</h1>
            <p className="text-sm mb-4" style={{ color: C.textMuted }}>
              광고·제휴 수수료 0%. 유저 정액 감정료로만 운영되며 원본 링크(Clean URL)만 제공합니다.
            </p>

            {profileLoaded && profileFound && (
              <div className="flex items-center justify-between text-xs px-3 py-2 rounded mb-5" style={{ backgroundColor: `${C.verify}10`, border: `1px solid ${C.verify}30`, color: C.textMuted }}>
                <span><Check size={12} className="inline mr-1" style={{ color: C.verify }} />{nickname ? `${nickname}님, ` : ""}저장된 프로필(주거 환경 포함)을 불러왔어요 (감정 이력 {history.length}건)</span>
                <button onClick={clearProfile} className="jbmono underline shrink-0 ml-2" style={{ color: C.textDim }}>삭제</button>
              </div>
            )}

            <label className="text-xs jbmono block mb-1 text-dim" style={{ color: C.textMuted }}>1. 카테고리 입력</label>
            <input
              value={category} onChange={(e) => setCategory(e.target.value)}
              placeholder="예: 식기세척기, 로봇청소기, 무선청소기, 매트리스"
              className="w-full px-4 py-3 rounded text-base outline-none mb-4"
              style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
            />

            <label className="text-xs jbmono block mb-1 text-dim" style={{ color: C.textMuted }}>1.5 닉네임 (선택)</label>
            <input
              value={nickname} onChange={(e) => setNickname(e.target.value)}
              placeholder="예: 워커홀릭, 뚜벅이맘 (실명 대신 별명)"
              className="w-full px-4 py-3 rounded text-base outline-none mb-1"
              style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
            />
            <p className="text-xs mb-6" style={{ color: C.textDim }}>
              <Lock size={11} className="inline mr-1" />닉네임·연령대·성별·감정 이력은 본인 Claude 계정에만 저장되며 외부로 전송되지 않아요.
            </p>

            <label className="text-xs jbmono block mb-2 text-dim" style={{ color: C.textMuted }}>2. 구매자 연령대</label>
            <div className="grid grid-cols-3 gap-2 mb-6">
              {AGE_RANGES.map((a) => (
                <button
                  key={a}
                  type="button"
                  onClick={() => setAgeRange(a)}
                  className="text-xs px-3 py-2 rounded transition-all"
                  style={{
                    backgroundColor: ageRange === a ? C.gold : C.paper,
                    color: ageRange === a ? "#171310" : C.textMuted,
                    border: `1px solid ${ageRange === a ? C.gold : C.borderLight}`,
                  }}
                >
                  {a}
                </button>
              ))}
            </div>

            <label className="text-xs jbmono block mb-2 text-dim" style={{ color: C.textMuted }}>3. 주거 환경 프리셋 설정</label>
            <div className="grid grid-cols-2 gap-3 mb-4">
              <div>
                <span className="text-xs block mb-1" style={{ color: C.textDim }}>주거 평수</span>
                <select
                  value={env.size} onChange={(e) => setEnv({ ...env, size: e.target.value })}
                  className="w-full p-2.5 rounded text-xs outline-none" style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
                >
                  <option>10평대 (원룸/1.5룸)</option>
                  <option>20평대 (투룸/소형아파트)</option>
                  <option>30평대 (표준 아파트)</option>
                  <option>40평대 이상 (대형 주택)</option>
                </select>
              </div>
              <div>
                <span className="text-xs block mb-1" style={{ color: C.textDim }}>가구원 수</span>
                <select
                  value={env.householdSize} onChange={(e) => setEnv({ ...env, householdSize: e.target.value })}
                  className="w-full p-2.5 rounded text-xs outline-none" style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
                >
                  <option>1인 가구</option>
                  <option>2인 가구</option>
                  <option>3~4인 가구</option>
                  <option>5인 이상 대가족</option>
                </select>
              </div>
            </div>

            <span className="text-xs block mb-2" style={{ color: C.textDim }}>동거 구성원 (해당 항목 모두 선택)</span>
            <div className="flex flex-wrap gap-2 mb-3">
              {HOUSEHOLD_TAGS.map((tag) => {
                const active = env.composition.includes(tag);
                return (
                  <button
                    key={tag}
                    type="button"
                    onClick={() => toggleComposition(tag)}
                    className="text-xs px-3 py-1.5 rounded-full transition-all"
                    style={{
                      backgroundColor: active ? C.gold : C.paper,
                      color: active ? "#171310" : C.textMuted,
                      border: `1px solid ${active ? C.gold : C.borderLight}`,
                    }}
                  >
                    {active ? "✓ " : ""}{tag}
                  </button>
                );
              })}
            </div>

            <input
              value={env.customNote} onChange={(e) => setEnv({ ...env, customNote: e.target.value })}
              placeholder="기타 (예: 반려묘 2마리, 거동 불편한 부모님 등 자유 입력)"
              className="w-full px-3 py-2.5 rounded text-xs outline-none mb-6"
              style={{ backgroundColor: C.paper, border: `1px solid ${C.borderLight}`, color: C.text }}
            />

            <button
              onClick={startCategory} disabled={busy || !category.trim()}
              className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: busy || !category.trim() ? C.paperRaised : C.gold, color: busy || !category.trim() ? C.textDim : "#171310" }}
            >
              {busy ? "카테고리 확인 중..." : "맞춤 심리 진단 시작"} {!busy && <ArrowRight size={16} />}
            </button>
          </div>
        )}

        {/* 범위 밖 카테고리 안내 */}
        {stage === "outOfScope" && scopeInfo && (
          <div className="mt-8">
            <div className="p-5 rounded-lg mb-6" style={{ backgroundColor: `${C.warn}10`, border: `1px solid ${C.warn}44` }}>
              <div className="flex items-center gap-2 mb-3">
                <AlertCircle size={18} style={{ color: C.warn }} />
                <span className="jbmono text-xs" style={{ color: C.warn }}>지원 범위 밖 · {scopeInfo.category_type_kr}</span>
              </div>
              <h2 className="serif text-xl font-semibold mb-2 leading-snug">"{category}"는 아직 감정해드릴 수 없어요</h2>
              <p className="text-sm leading-relaxed" style={{ color: C.textMuted }}>
                {scopeInfo.reason_kr}. 이 서비스는 브랜드/모델을 비교해 판매처에서 구매하는 <span style={{ color: C.text }}>실물 제품</span>에 한해 정확한 감정을 제공해요. 여행, 보험, 시공, 구독 서비스처럼 정찰 가격 비교가 어려운 영역은 아직 준비 중입니다.
              </p>
            </div>

            {scopeInfo.example_categories_kr && scopeInfo.example_categories_kr.length > 0 && (
              <div className="mb-6">
                <span className="text-xs block mb-2" style={{ color: C.textDim }}>대신 이런 실물 제품은 감정 가능해요</span>
                <div className="flex flex-wrap gap-2">
                  {scopeInfo.example_categories_kr.map((ex, i) => (
                    <button
                      key={i}
                      onClick={() => { setCategory(ex); setScopeInfo(null); setStage("category"); }}
                      className="text-xs px-3 py-1.5 rounded-full transition-all"
                      style={{ backgroundColor: C.paper, color: C.text, border: `1px solid ${C.borderLight}` }}
                    >
                      {ex}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <button
              onClick={backToCategoryEdit}
              className="flex items-center justify-center gap-2 w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: C.paperRaised, color: C.text, border: `1px solid ${C.borderLight}` }}
            >
              <RotateCcw size={15} /> 다른 제품으로 다시 입력하기
            </button>
          </div>
        )}

        {/* STEP 0.3: 이미 생각해둔 제품/브랜드가 있는지 확인 */}
        {stage === "candidate" && (
          <div className="mt-8">
            <div className="jbmono text-xs mb-2" style={{ color: C.gold }}>STEP 0.3 · 후보 제품 확인</div>
            <h2 className="serif text-xl font-semibold mb-2 leading-snug">"{category}" 중에서 이미 생각해두신 특정 제품이나 브랜드가 있나요?</h2>
            <p className="text-sm mb-6" style={{ color: C.textMuted }}>

                      </div>
                    )}

                    {/* 판매처 가격 비교는 유료 리포트(추천1·2 + 대안)에서만 제공합니다.
                        예전엔 여기서 무료로 4곳 비교를 다 보여줬는데, 그러면 정작 유료
                        리포트가 뜰 때는 이미 가장 비싼(가치있는) 부분을 공짜로 다 본
                        뒤라 의미가 없어졌다 — 그래서 이 카드에서는 추정 가격대만
                        보여주고, 실제 판매처 비교는 아래 유료 리포트로 일원화한다. */}
                    <div className="pt-2 text-xs" style={{ color: C.textDim }}>
                      <div className="flex items-center justify-between">
                        <span>예상 가격대: {rec.price_range_kr}</span>
                        <span className="jbmono" style={{ color: C.verify }}>✓ Clean URL Verified</span>
                      </div>
                      <div className="mt-1" style={{ fontSize: "10px", color: C.textDim }}>
                        * 검색 기반 추정치입니다. 실제 판매처별 가격은 아래 상세 비교 리포트에서 확인하세요.
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* ── 판매처 비교: 추천1 · 추천2 · 대안(가격비교용) 순서대로 표시 ──
                결제(1,900원)는 이미 질문 완료 직후 단계에서 끝났으므로, 여기서는
                별도 버튼 없이 곧바로 결과를 보여준다. paidReportOpen은
                unlockAndFetchAllVendors가 결제 직후 자동으로 true로 세팅한다. */}
            {paidReportOpen && Array.isArray(result.recommendations) && (
              <div className="flex flex-col gap-4">
                {[0, 1, 2].map((idx) => {
                  const rec = result.recommendations[idx];
                  if (!rec) return null;
                  const isAlt = !!rec.is_paid_alt;
                  return (
                    <div key={idx} className="rounded-lg p-4 border" style={{ backgroundColor: C.bg, borderColor: isAlt ? C.borderLight : C.gold }}>
                      <div className="flex items-center justify-between mb-2">
                        <div>
                          <span className="jbmono text-xs px-2 py-0.5 rounded font-semibold" style={{ backgroundColor: isAlt ? C.paperRaised : C.gold, color: isAlt ? C.textMuted : "#171310" }}>
                            {isAlt ? "대안" : `추천 ${idx + 1}`}
                          </span>
                          <div className="serif text-base font-semibold mt-1">{rec.name}</div>
                          {isAlt && (
                            <div className="text-xs mt-0.5" style={{ color: C.textDim }}>추천 1·2와 비교해보세요</div>
                          )}
                        </div>
                      </div>

                      <label className="flex items-center gap-1.5 text-xs mb-2 cursor-pointer" style={{ color: C.textMuted }}>
                        <input
                          type="checkbox"
                          checked={!!includeOverseas[idx]}
                          onChange={(e) => toggleIncludeOverseas(idx, rec.name, rec.officialMallUrl, e.target.checked, rec.price_range_kr)}
                        />
                        해외 직구도 포함해서 찾기 (배송기간·관부가세 발생 가능, A/S 불가)
                      </label>

                      {vendorLoading[idx] && (
                        <div className="text-xs jbmono flex flex-col gap-1" style={{ color: C.gold }}>
                          <span>판매처 페이지를 동시에 열어 재고·가격을 확인하는 중... ({vendorElapsed[idx] || 0}초 경과)</span>
                          <span style={{ color: C.textDim }}>보통 10~20초 정도 걸립니다.</span>
                        </div>
                      )}
                      {!vendorLoading[idx] && vendorError[idx] && !vendorData[idx] && (
                        <div className="flex items-center justify-between gap-2 text-xs" style={{ color: C.warn }}>
                          <span className="flex items-center gap-1.5"><AlertCircle size={13} /> {vendorError[idx]}</span>
                          <button
                            onClick={() => retryVendorCompare(idx, rec.name, rec.officialMallUrl, rec.price_range_kr)}
                            className="px-2 py-1 rounded jbmono"
                            style={{ backgroundColor: C.paperRaised, color: C.text, border: `1px solid ${C.borderLight}` }}
                          >
                            재시도
                          </button>
                        </div>
                      )}
                      {vendorData[idx] && !vendorData[idx].all_verified_failed && Array.isArray(vendorData[idx].vendors) && (
                        <div className="flex flex-col gap-2 mt-1">
                          {vendorData[idx].vendors.map((v, k) => (
                            <div key={k} className="flex items-center justify-between p-2 rounded" style={{ backgroundColor: C.paper, border: `1px solid ${C.border}` }}>
                              <div>
                                <div className="text-xs font-medium">{v.name}</div>
                                <div className="text-xs" style={{ color: C.textMuted }}>{v.price_krw} · {v.shipping_kr}</div>
                              </div>
                              <a href={v.url} target="_blank" rel="noopener noreferrer"
                                className="text-xs px-2.5 py-1 rounded flex items-center gap-1"
                                style={{ backgroundColor: C.gold, color: "#171310" }}>
                                바로가기 <ExternalLink size={10} />
                              </a>
                            </div>
                          ))}
                        </div>
                      )}
                      {vendorData[idx] && vendorData[idx].all_verified_failed && (
                        <div className="text-xs p-2.5 rounded flex items-start gap-1.5" style={{ backgroundColor: `${C.warn}12`, color: C.warn, border: `1px solid ${C.warn}44` }}>
                          <AlertCircle size={13} className="shrink-0 mt-0.5" />
                          <span>이 상품과 정확히 일치하는 판매 페이지를 찾지 못했어요. 검색 링크로 직접 확인해주세요.</span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            <button onClick={reset} className="w-full py-3.5 rounded font-medium transition-all"
              style={{ backgroundColor: C.paperRaised, color: C.text, border: `1px solid ${C.borderLight}` }}>
              다른 제품 새로 감정하기
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<AdaptiveAppraisalTest />);
</script>
